<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pang Game Company - Command Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#1c1512',     // Dark warm room bg
                        panelBg: '#2b1e16',    // Toast crust panel
                        neonBlue: '#06b6d4',   // RGB Keyboard Cyan
                        neonGreen: '#10b981',  // -80% Tag Green
                        neonOrange: '#f97316', // Flame Orange
                        neonPurple: '#d946ef', // RGB Keyboard Pink
                        neonRed: '#ef4444',    // Cape Red
                        gridColor: 'rgba(249, 115, 22, 0.1)',
                    },
                    fontFamily: {
                        pixel: ['"VT323"', 'monospace'],
                        title: ['"Silkscreen"', 'cursive'],
                        game: ['"Inter"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel 7 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #1c1512;
            color: #fed7aa;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            /* Circuit board grid background */
            background-image: 
                linear-gradient(rgba(249, 115, 22, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Custom MMO Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #fdba74; }

        /* Panels Kairosoft Style */
        .panel {
            background-color: #2b1e16;
            border: 4px solid #7c2d12;
            border-radius: 4px;
            box-shadow:  inset 3px 3px 0px rgba(255,255,255,0.1), inset -3px -3px 0px rgba(0,0,0,0.3), 0 4px 6px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        .panel-blue { border-color: #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
        .panel-orange { border-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.2); }
        .panel-green { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

        .panel-header {
            position: absolute;
            top: -10px;
            left: 16px;
            background: #1c1512;
            padding: 0 8px;
            font-size: 14px;
            color: #fdba74;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 5px currentColor;
        }

        /* Status Dots */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; transition: all 0.3s; }
        .dot-green { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .dot-orange { background-color: #f97316; box-shadow: 0 0 8px #f97316; }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 12px #ef4444; animation: pulse 1s infinite alternate; }
        .dot-gray { background-color: #475569; }

        @keyframes pulse {
            from { box-shadow: 0 0 5px #ef4444; }
            to { box-shadow: 0 0 20px #ef4444; }
        }

        /* Avatar Box */
        .avatar-box {
            width: 40px; height: 40px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            /* Kairosoft UI Element Border */
            border: 3px solid #334155;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.1), inset -2px -2px 0px rgba(0,0,0,0.4);
        }

        /* Bar Chart Animation */
        .bar { transition: height 0.5s ease-out; }

        /* Kairosoft UX Animations */
        @keyframes kairosoftWork {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(0.95); }
            100% { transform: translateY(0px) scale(1); }
        }
        .anim-work img { animation: kairosoftWork 0.3s infinite alternate; }
        
        .hud-box {
            background-color: #1e293b;
            border: 3px solid #cbd5e1;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            font-family: 'VT323', monospace;
            padding: 4px 12px;
            color: #fff;
            font-size: 1.5rem;
            display: inline-block;
        }

        /* Pixel Office Styles */
        .pixel-floor {
            background: repeating-conic-gradient(#2a1f14 0% 25%, #231a10 0% 50%) 0 0 / 20px 20px;
        }
        .pixel-desk {
            width: 56px; height: 32px;
            background: #8B5E3C;
            border: 2px solid #5C3A1E;
            border-radius: 2px;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), 0 4px 0 #3d2210;
            position: relative;
        }
        .pixel-desk::after {
            content: '';
            position: absolute; bottom: -8px; left: 10px;
            width: 36px; height: 8px;
            background: #5C3A1E;
            border-radius: 0 0 2px 2px;
        }
        .pixel-monitor {
            width: 24px; height: 18px;
            background: #111;
            border: 2px solid #555;
            border-radius: 2px;
            position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 0 6px rgba(6,182,212,0.4);
            transition: all 0.3s;
        }
        .pixel-monitor.on {
            background: #0c2d3f;
            box-shadow: 0 0 12px rgba(6,182,212,0.8);
            border-color: #06b6d4;
        }
        .pixel-monitor.on::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 14px; height: 2px; background: #06b6d4;
            animation: monitorBlink 1.5s infinite;
        }
        .pixel-monitor.on::before {
            content: ''; position: absolute; top: 7px; left: 3px;
            width: 10px; height: 2px; background: #10b981;
            animation: monitorBlink 2s 0.5s infinite;
        }
        @keyframes monitorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .pixel-char {
            width: 20px; height: 24px;
            image-rendering: pixelated;
            position: absolute; top: -28px;
        }
        @keyframes pixelTyping {
            0%, 100% { transform: translateY(0) scaleY(1); }
            15% { transform: translateY(-3px) scaleY(0.95); }
            30% { transform: translateY(0) scaleY(1); }
            45% { transform: translateY(-2px) scaleY(0.97); }
            60% { transform: translateY(0) scaleY(1); }
        }
        .typing .pixel-char { animation: pixelTyping 0.6s infinite; }
        @keyframes pixelIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1px); }
        }
        .idle .pixel-char { animation: pixelIdle 3s infinite; }

        /* Particles floating up from monitor */
        @keyframes particleUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-20px) scale(0.3); opacity: 0; }
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleUp 1.2s ease-out infinite;
        }

        /* Emoji bubble pop */
        @keyframes bubblePop {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            20% { transform: translateX(-50%) scale(1.2); opacity: 1; }
            30% { transform: translateX(-50%) scale(1); opacity: 1; }
            80% { transform: translateX(-50%) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) scale(0.5); opacity: 0; }
        }
        .emoji-bubble {
            position: absolute;
            top: -38px; left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 2px solid #444;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 16px;
            animation: bubblePop 2s ease-in-out infinite;
            z-index: 10;
            white-space: nowrap;
        }
        .emoji-bubble::after {
            content: '';
            position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #444;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-4 md:p-6 overflow-hidden">
    <div id="root" class="h-full flex flex-col w-full max-w-[1600px] mx-auto gap-6 relative"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = window.location.origin;

        const AI_ROLES = [
            { id: 'scout', name: 'นักข่าว (RSS Scout)', image: 'assets/avatars/researcher.png', dept: 'Core' },
            { id: 'brain', name: 'นักเขียน (Mistral)', image: 'assets/avatars/executor.png', dept: 'Post' },
            { id: 'guardian', name: 'ตรวจสอบ (Guardian)', image: 'assets/avatars/guardian.png', dept: 'Core' },
            { id: 'anti', name: 'กราฟิก (Creatomate)', image: 'assets/avatars/guardian.png', dept: 'Post' },
            { id: 'publisher', name: 'โพสต์ (FB/IG)', image: 'assets/avatars/summarizer.png', dept: 'Post' },
            { id: 'voice', name: 'พากย์เสียง (ElevenLabs)', image: 'assets/avatars/router.png', dept: 'Reels' },
            { id: 'pexel', name: 'หาคลิป (Pexels)', image: 'assets/avatars/researcher.png', dept: 'Reels' }
        ];

        // Simulated Flow
        const DEMO_FLOW = [
            { time: 500, agent: 'scout', status: '[ACTIVE]', dot: 'dot-green', progress: 100, msg: 'กำลังดึงข่าวจาก RSS...' },
            { time: 2000, agent: 'scout', status: '[DONE]', dot: 'dot-green', progress: 40, msg: 'ได้ข่าวใหม่ 2 ข่าว! ส่งต่อให้นักเขียน...' },
            { time: 3000, agent: 'guardian', status: '[CHECKING]', dot: 'dot-orange', progress: 60, msg: 'ตรวจสอบ: ไม่ซ้ำ + ข่าวไม่เกิน 24 ชม. ผ่าน!' },
            { time: 4500, agent: 'brain', status: '[WRITING]', dot: 'dot-green', progress: 80, msg: 'Gemini กำลังเขียน Caption + mascot_mood...' },
            { time: 6000, agent: 'anti', status: '[RENDERING]', dot: 'dot-orange', progress: 100, msg: 'Creatomate กำลังวาดภาพ 1:1 + แปะน้อง Pang...' },
            { time: 7500, agent: 'anti', status: '[DONE]', dot: 'dot-green', progress: 80, msg: 'ภาพเสร็จแล้ว! ส่งต่อให้ฝ่ายโพสต์...' },
            { time: 9000, agent: 'publisher', status: '[POSTING]', dot: 'dot-green', progress: 100, msg: 'กำลังโพสต์ Facebook + Instagram...' },
            { time: 10000, agent: 'publisher', status: '[DONE]', dot: 'dot-green', progress: 100, msg: '✅ โพสต์สำเร็จ! รอรอบถัดไป 30 นาที' }
        ];

        const App = () => {
            const [time, setTime] = useState('');
            const [budget, setBudget] = useState(1000);
            
            // UI States
            const [activeFlowIndex, setActiveFlowIndex] = useState(-1);
            const [isRunning, setIsRunning] = useState(false);
            const [requiresApproval, setRequiresApproval] = useState(false);
            const [chatInput, setChatInput] = useState('');
            
            // Random bar chart heights for visual effect
            const [chartHeights, setChartHeights] = useState([20, 40, 30, 70, 50, 90, 60]);

            // Agent States Array
            const [agents, setAgents] = useState(AI_ROLES.map(r => ({
                id: r.id, status: '[SLEEP]', dot: 'dot-gray', msg: 'Offline'
            })));

            // Panel states
            const [showPanel, setShowPanel] = useState(null); // 'agents' | 'memory' | 'train' | null
            const [agentList, setAgentList] = useState([]);
            const [allMemory, setAllMemory] = useState({});
            const [trainAgent, setTrainAgent] = useState('');
            const [trainFeedback, setTrainFeedback] = useState('');
            const [trainResult, setTrainResult] = useState('');
            const [pmChatInput, setPmChatInput] = useState('');
            const [pmChatLogs, setPmChatLogs] = useState([]);
            const [pmChatLoading, setPmChatLoading] = useState(false);
            const [pipelineOutput, setPipelineOutput] = useState('');
            const [pipelineRunning, setPipelineRunning] = useState(false);
            const [tokenData, setTokenData] = useState([]);
            const [schedulerOn, setSchedulerOn] = useState(false);
            const [postMode, setPostMode] = useState('approve');
            const [pendingPosts, setPendingPosts] = useState([]);

            const [chatLogs, setChatLogs] = useState([
                { sysTime: 'SYS', agent: 'System', msg: 'Pang Game Company v1.1 OS Booted.', isSys: true }
            ]);

            const logsEndRef = useRef(null);

            // Fetch post mode
            const fetchPostMode = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/postmode');
                    const data = await res.json();
                    setPostMode(data.mode);
                } catch(e) {}
            };

            // Toggle post mode
            const togglePostMode = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/postmode', { method: 'POST' });
                    const data = await res.json();
                    setPostMode(data.mode);
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: data.mode === 'auto' ? 'เปลี่ยนเป็น: โพสต์เลย' : 'เปลี่ยนเป็น: ถามก่อน', isSys: true }]);
                } catch(e) {}
            };

            // Fetch pending posts
            const fetchPending = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/pending');
                    const data = await res.json();
                    setPendingPosts(data);
                } catch(e) {}
            };

            // Approve pending post
            const approvePending = async (id) => {
                try {
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'Admin', msg: 'อนุมัติโพสต์ #' + id, isAdmin: true }]);
                    const res = await fetch(API_BASE + '/api/pending/' + id + '/approve', { method: 'POST' });
                    const data = await res.json();
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: data.msg || data.error, isSys: true }]);
                    fetchPending();
                } catch(e) {}
            };

            // Reject pending post
            const rejectPending = async (id) => {
                try {
                    const res = await fetch(API_BASE + '/api/pending/' + id + '/reject', { method: 'POST' });
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: 'ลบโพสต์ #' + id, isSys: true }]);
                    fetchPending();
                } catch(e) {}
            };

            // Fetch scheduler status
            const fetchScheduler = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/scheduler');
                    const data = await res.json();
                    setSchedulerOn(data.status === 'running');
                } catch(e) { /* ignore */ }
            };

            // Toggle scheduler
            const toggleScheduler = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/scheduler', { method: 'POST' });
                    const data = await res.json();
                    setSchedulerOn(data.status === 'running');
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'Scheduler', msg: data.msg, isSys: true }]);
                } catch(e) { /* ignore */ }
            };

            // Fetch token status
            const fetchTokens = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/tokens');
                    const data = await res.json();
                    setTokenData(data);
                } catch(e) { /* ignore */ }
            };

            // Fetch agents list
            const fetchAgents = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/agents');
                    const data = await res.json();
                    setAgentList(data);
                } catch(e) { setAgentList([]); }
            };

            // Fetch all memory
            const fetchMemory = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/memory');
                    const data = await res.json();
                    setAllMemory(data);
                } catch(e) { setAllMemory({}); }
            };

            // Train agent
            const handleTrain = async () => {
                if (!trainAgent || !trainFeedback.trim()) return;
                try {
                    const res = await fetch(API_BASE + '/api/train', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ agent: trainAgent, feedback: trainFeedback })
                    });
                    const data = await res.json();
                    setTrainResult(`เทรน ${data.name} สำเร็จ! memory: ${data.memoryCount} รายการ`);
                    setTrainFeedback('');
                    fetchMemory();
                } catch(e) { setTrainResult('เทรนไม่สำเร็จ'); }
            };

            // Chat with PM
            const handlePmChat = async () => {
                if (!pmChatInput.trim() || pmChatLoading) return;
                const msg = pmChatInput.trim();
                setPmChatLogs(prev => [...prev, { from: 'admin', text: msg }]);
                setPmChatInput('');
                setPmChatLoading(true);
                try {
                    const res = await fetch(API_BASE + '/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: msg })
                    });
                    const data = await res.json();
                    let reply = data.reply || data.text || JSON.stringify(data);
                    if (data.trained) reply += '\n\n(PM เทรนพนักงานแล้ว)';
                    setPmChatLogs(prev => [...prev, { from: 'pm', text: reply }]);
                } catch(e) {
                    setPmChatLogs(prev => [...prev, { from: 'pm', text: 'Error: ติดต่อ PM ไม่ได้' }]);
                }
                setPmChatLoading(false);
            };

            // Run pipeline (fire-and-forget + poll status)
            const handleRunPipeline = async () => {
                if (pipelineRunning) return;
                setPipelineRunning(true);
                setPipelineOutput('กำลังรัน pipeline...');
                const now = new Date();
                setChatLogs(prev => [...prev, { sysTime: `${now.getHours()}:${now.getMinutes()}`, agent: 'Admin', msg: '!run pipeline (REAL)', isAdmin: true }]);
                try {
                    const res = await fetch(API_BASE + '/api/run', { method: 'POST' });
                    const data = await res.json();
                    setPipelineOutput(data.output || data.error || 'started');

                    // Poll status ทุก 3 วินาที จนเสร็จ
                    const poll = setInterval(async () => {
                        try {
                            const sr = await fetch(API_BASE + '/api/run/status');
                            const st = await sr.json();
                            if (st.status !== 'running') {
                                clearInterval(poll);
                                setPipelineRunning(false);
                                setPipelineOutput(st.log || 'Pipeline เสร็จแล้ว');
                                setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: 'Pipeline เสร็จแล้ว ดู output ใน panel', isSys: true }]);
                            } else {
                                setPipelineOutput(st.log || 'กำลังทำงาน...');
                            }
                        } catch(pe) { /* ignore poll error */ }
                    }, 3000);
                } catch(e) {
                    setPipelineOutput('Error: ' + e.message);
                    setPipelineRunning(false);
                }
            };

            // Fetch tokens + scheduler + mode + pending on mount + every 15s
            useEffect(() => {
                fetchTokens(); fetchScheduler(); fetchPostMode(); fetchPending();
                const interval = setInterval(() => {
                    fetchTokens(); fetchScheduler(); fetchPostMode(); fetchPending();
                }, 15000);
                return () => clearInterval(interval);
            }, []);

            // Clock & Random Chart data
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    setTime(now.toLocaleTimeString('en-US', { hour12: false }) + ' AM');
                }, 1000);

                const chartInterval = setInterval(() => {
                    if (isRunning) {
                        setChartHeights(prev => prev.map(() => Math.floor(Math.random() * 80) + 10));
                    }
                }, 1500);

                return () => { clearInterval(interval); clearInterval(chartInterval); }
            }, [isRunning]);

            // Scroll chat
            useEffect(() => {
                if (logsEndRef.current) logsEndRef.current.scrollIntoView({ behavior: "smooth" });
            }, [chatLogs]);

            // Core Logic Runner
            useEffect(() => {
                if (isRunning && activeFlowIndex < DEMO_FLOW.length) {
                    const step = DEMO_FLOW[activeFlowIndex];
                    if (step) {
                        const timer = setTimeout(() => {
                            // Update specific agent state
                            setAgents(prev => prev.map(a => 
                                a.id === step.agent 
                                ? { ...a, status: step.status, dot: step.dot, msg: step.msg } 
                                : a.status !== '[SLEEP]' && a.id !== step.agent 
                                    ? { ...a, status: '[STANDBY]', dot: 'dot-gray' } 
                                    : a
                            ));

                            // Push to Game Chat
                            const now = new Date();
                            const logTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                            
                            const foundRole = AI_ROLES.find(r => r.id === step.agent);
                            setChatLogs(prev => [...prev, {
                                sysTime: logTime,
                                agent: foundRole ? foundRole.name : 'SYS',
                                msg: step.msg,
                                isAlert: step.isAlert
                            }]);
                            
                            if (step.isAlert) {
                                setRequiresApproval(true);
                                setIsRunning(false);
                            }

                            setActiveFlowIndex(idx => idx + 1);
                        }, activeFlowIndex === 0 ? 0 : DEMO_FLOW[activeFlowIndex].time - DEMO_FLOW[activeFlowIndex-1].time);
                        return () => clearTimeout(timer);
                    }
                }
            }, [isRunning, activeFlowIndex]);

            const handleStart = () => {
                if (isRunning) return;
                setAgents(prev => prev.map(a => ({ ...a, status: '[STANDBY]', dot: 'dot-gray', msg: 'Waiting...' })));
                
                const now = new Date();
                setChatLogs(prev => [...prev, {
                    sysTime: `${now.getHours()}:${now.getMinutes()}`,
                    agent: 'Admin',
                    msg: '!run pipeline --force',
                    isAdmin: true
                }]);
                
                setActiveFlowIndex(0);
                setRequiresApproval(false);
                setIsRunning(true);
            };

            const handleApprove = () => {
                setRequiresApproval(false);
                setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'Admin', msg: '/approve (Confirmed delivery)', isAdmin: true }]);
                
                setAgents(prev => prev.map(a => a.id === 'guardian' ? { ...a, status: '[PASSED]', dot: 'dot-green' } : a));
                
                // Deduct random budget for effect
                setBudget(b => b - Math.floor(Math.random() * 20 + 5));
                
                setTimeout(() => {
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: 'Delivery confirmed. Awaiting next cycle.', isSys: true }]);
                }, 1000);

                                                        <div className="text-[#fed7aa] font-bold">{a.name}</div>
                                                        <div className="text-gray-400 text-xs">{a.role}</div>
                                                        <div className="text-gray-500 text-xs mt-1">{a.provider}/{a.model}</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="font-pixel text-neonBlue text-lg">{a.memoryCount}</div>
                                                        <div className="text-gray-500 text-xs">memories</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* ดู Memory */}
                                    {showPanel === 'memory' && (
                                        <div className="flex flex-col gap-4">
                                            {Object.keys(allMemory).length === 0 && <div className="text-gray-400 font-pixel">กำลังโหลด...</div>}
                                            {Object.entries(allMemory).map(([name, mems]) => {
                                                const arr = Array.isArray(mems) ? mems : [];
                                                return (
                                                <div key={name} className="bg-black/50 border border-gray-700 rounded p-3">
                                                    <div className="text-neonOrange font-pixel text-lg mb-2">{name} ({arr.length} ความจำ)</div>
                                                    {arr.length === 0 && <div className="text-gray-500 text-xs">(ยังไม่มี feedback)</div>}
                                                    {arr.map((m, i) => (
                                                        <div key={i} className="text-xs text-gray-300 mb-1 pl-2 border-l-2 border-gray-600">
                                                            <span className="text-gray-500">{m.date ? m.date.slice(0,10) : ''}</span>{' '}
                                                            <span className="text-neonBlue">[{m.from}]</span>{' '}
                                                            {m.feedback}
                                                        </div>
                                                    ))}
                                                </div>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {/* คุยกับ PM */}
                                    {showPanel === 'chat' && (
                                        <div className="flex flex-col gap-3 h-full">
                                            <div className="text-gray-500 text-xs">พิมพ์สั่ง PM ได้เลย เช่น "สอนนักเขียนว่า caption ห้ามยาวเกิน 3 บรรทัด" หรือ "สรุปสถานะทีมหน่อย"</div>

                                            {/* Chat messages */}
                                            <div className="flex-1 overflow-y-auto bg-black/60 border border-gray-700 rounded p-3 flex flex-col gap-2 min-h-[200px] max-h-[400px]">
                                                {pmChatLogs.length === 0 && <div className="text-gray-500 text-sm text-center mt-8">เริ่มคุยกับ PM ได้เลย</div>}
                                                {pmChatLogs.map((msg, i) => (
                                                    <div key={i} className={`flex ${msg.from === 'admin' ? 'justify-end' : 'justify-start'}`}>
                                                        <div className={`max-w-[80%] px-3 py-2 rounded-lg text-sm whitespace-pre-wrap ${msg.from === 'admin' ? 'bg-neonBlue/20 text-neonBlue border border-neonBlue/30' : 'bg-neonOrange/20 text-[#fed7aa] border border-neonOrange/30'}`}>
                                                            <div className="text-[10px] font-pixel mb-1 opacity-60">{msg.from === 'admin' ? 'แอดมิน' : 'PM (AI)'}</div>
                                                            {msg.text}
                                                        </div>
                                                    </div>
                                                ))}
                                                {pmChatLoading && (
                                                    <div className="text-neonOrange font-pixel text-sm animate-pulse">PM กำลังคิด...</div>
                                                )}
                                            </div>

                                            {/* Input */}
                                            <div className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={pmChatInput}
                                                    onChange={e => setPmChatInput(e.target.value)}
                                                    onKeyDown={e => e.key === 'Enter' && handlePmChat()}
                                                    placeholder="พิมพ์ข้อความถึง PM..."
                                                    className="flex-1 bg-black/80 border border-gray-600 text-white p-2 rounded font-pixel"
                                                    disabled={pmChatLoading}
                                                />
                                                <button
                                                    onClick={handlePmChat}
                                                    disabled={pmChatLoading || !pmChatInput.trim()}
                                                    className="px-4 py-2 rounded font-pixel border-2 border-neonOrange text-neonOrange hover:bg-neonOrange/20 disabled:opacity-30 transition-all">
                                                    ส่ง
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* === Pipeline Output Modal === */}
                    {pipelineOutput && (
                        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={() => setPipelineOutput('')}>
                            <div className="panel panel-green w-full max-w-3xl max-h-[80vh] flex flex-col p-6 pt-8" onClick={e => e.stopPropagation()}>
                                <div className="panel-header text-neonGreen">PIPELINE OUTPUT</div>
                                <button onClick={() => setPipelineOutput('')} className="absolute top-2 right-4 text-gray-400 hover:text-white text-xl font-bold">✕</button>
                                <pre className="flex-1 overflow-y-auto bg-black/80 border border-gray-700 rounded p-4 text-xs text-green-300 font-mono whitespace-pre-wrap mt-2">
                                    {pipelineOutput}
                                </pre>
                            </div>
                        </div>
                    )}

                    {/* === Pending Posts (รอตรวจ) === */}
                    {pendingPosts.length > 0 && (
                        <div className="fixed bottom-4 right-4 z-40 w-96 max-h-[60vh] overflow-y-auto panel panel-orange p-4 pt-8 shadow-2xl">
                            <div className="panel-header text-neonOrange">รอตรวจ ({pendingPosts.length})</div>
                            {pendingPosts.map(function(p) {
                                return React.createElement('div', { key: p.id, className: 'bg-black/60 border border-gray-700 rounded p-3 mb-2' },
                                    React.createElement('div', { className: 'text-[10px] text-gray-500 mb-1' }, p.time + ' | #' + p.id),
                                    p.items.map(function(item, j) {
                                        return React.createElement('div', { key: j, className: 'mb-2' },
                                            React.createElement('div', { className: 'text-sm font-bold ' + (item.mood === 'fail' ? 'text-red-400' : 'text-neonGreen') }, item.headline),
                                            React.createElement('div', { className: 'text-xs text-gray-400 mt-1 line-clamp-3' }, item.caption)
                                        );
                                    }),
                                    React.createElement('div', { className: 'flex gap-2 mt-2' },
                                        React.createElement('button', {
                                            onClick: function() { approvePending(p.id); },
                                            className: 'flex-1 py-1 rounded font-pixel text-sm border-2 border-green-500 text-green-400 bg-green-500/10 hover:bg-green-500/30'
                                        }, 'อนุมัติ'),
                                        React.createElement('button', {
                                            onClick: function() { rejectPending(p.id); },
                                            className: 'flex-1 py-1 rounded font-pixel text-sm border-2 border-red-500 text-red-400 bg-red-500/10 hover:bg-red-500/30'
                                        }, 'ไม่เอา')
                                    )
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
