<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pang Game Company - Command Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#1c1512',     // Dark warm room bg
                        panelBg: '#2b1e16',    // Toast crust panel
                        neonBlue: '#06b6d4',   // RGB Keyboard Cyan
                        neonGreen: '#10b981',  // -80% Tag Green
                        neonOrange: '#f97316', // Flame Orange
                        neonPurple: '#d946ef', // RGB Keyboard Pink
                        neonRed: '#ef4444',    // Cape Red
                        gridColor: 'rgba(249, 115, 22, 0.1)',
                    },
                    fontFamily: {
                        pixel: ['"VT323"', 'monospace'],
                        title: ['"Silkscreen"', 'cursive'],
                        game: ['"Inter"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel 7 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #1c1512;
            color: #fed7aa;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            /* Circuit board grid background */
            background-image: 
                linear-gradient(rgba(249, 115, 22, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Custom MMO Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #fdba74; }

        /* Panels Kairosoft Style */
        .panel {
            background-color: #2b1e16;
            border: 4px solid #7c2d12;
            border-radius: 4px;
            box-shadow:  inset 3px 3px 0px rgba(255,255,255,0.1), inset -3px -3px 0px rgba(0,0,0,0.3), 0 4px 6px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        .panel-blue { border-color: #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
        .panel-orange { border-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.2); }
        .panel-green { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

        .panel-header {
            position: absolute;
            top: -10px;
            left: 16px;
            background: #1c1512;
            padding: 0 8px;
            font-size: 14px;
            color: #fdba74;
            font-family: 'VT323', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 5px currentColor;
            z-index: 10;
        }

        /* Status Dots */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; transition: all 0.3s; }
        .dot-green { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .dot-orange { background-color: #f97316; box-shadow: 0 0 8px #f97316; }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 12px #ef4444; animation: pulse 1s infinite alternate; }
        .dot-gray { background-color: #475569; }

        @keyframes pulse {
            from { box-shadow: 0 0 5px #ef4444; }
            to { box-shadow: 0 0 20px #ef4444; }
        }

        /* Avatar Box */
        .avatar-box {
            width: 40px; height: 40px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            /* Kairosoft UI Element Border */
            border: 3px solid #334155;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.1), inset -2px -2px 0px rgba(0,0,0,0.4);
        }

        /* Bar Chart Animation */
        .bar { transition: height 0.5s ease-out; }

        /* Kairosoft UX Animations */
        @keyframes kairosoftWork {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(0.95); }
            100% { transform: translateY(0px) scale(1); }
        }
        .anim-work img { animation: kairosoftWork 0.3s infinite alternate; }
        
        .hud-box {
            background-color: #1e293b;
            border: 3px solid #cbd5e1;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            font-family: 'VT323', monospace;
            padding: 4px 12px;
            color: #fff;
            font-size: 1.5rem;
            display: inline-block;
        }

        /* Pixel Office Styles */
        .pixel-floor {
            background: repeating-conic-gradient(#2a1f14 0% 25%, #231a10 0% 50%) 0 0 / 20px 20px;
        }
        .pixel-desk {
            width: 56px; height: 32px;
            background: #8B5E3C;
            border: 2px solid #5C3A1E;
            border-radius: 2px;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), 0 4px 0 #3d2210;
            position: relative;
        }
        .pixel-desk::after {
            content: '';
            position: absolute; bottom: -8px; left: 10px;
            width: 36px; height: 8px;
            background: #5C3A1E;
            border-radius: 0 0 2px 2px;
        }
        .pixel-monitor {
            width: 24px; height: 18px;
            background: #111;
            border: 2px solid #555;
            border-radius: 2px;
            position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 0 6px rgba(6,182,212,0.4);
            transition: all 0.3s;
        }
        .pixel-monitor.on {
            background: #0c2d3f;
            box-shadow: 0 0 12px rgba(6,182,212,0.8);
            border-color: #06b6d4;
        }
        .pixel-monitor.on::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 14px; height: 2px; background: #06b6d4;
            animation: monitorBlink 1.5s infinite;
        }
        .pixel-monitor.on::before {
            content: ''; position: absolute; top: 7px; left: 3px;
            width: 10px; height: 2px; background: #10b981;
            animation: monitorBlink 2s 0.5s infinite;
        }
        @keyframes monitorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .pixel-char {
            width: 20px; height: 24px;
            image-rendering: pixelated;
            position: absolute; top: -28px;
        }
        @keyframes pixelTyping {
            0%, 100% { transform: translateY(0) scaleY(1); }
            15% { transform: translateY(-3px) scaleY(0.95); }
            30% { transform: translateY(0) scaleY(1); }
            45% { transform: translateY(-2px) scaleY(0.97); }
            60% { transform: translateY(0) scaleY(1); }
        }
        .typing .pixel-char { animation: pixelTyping 0.6s infinite; }
        @keyframes pixelIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1px); }
        }
        .idle .pixel-char { animation: pixelIdle 3s infinite; }

        /* Particles floating up from monitor */
        @keyframes particleUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-20px) scale(0.3); opacity: 0; }
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleUp 1.2s ease-out infinite;
        }

        /* Emoji bubble pop */
        @keyframes bubblePop {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            20% { transform: translateX(-50%) scale(1.2); opacity: 1; }
            30% { transform: translateX(-50%) scale(1); opacity: 1; }
            80% { transform: translateX(-50%) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) scale(0.5); opacity: 0; }
        }
        .emoji-bubble {
            position: absolute;
            top: -38px; left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            border: 2px solid #444;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 16px;
            animation: bubblePop 2s ease-in-out infinite;
            z-index: 10;
            white-space: nowrap;
        }
        .emoji-bubble::after {
            content: '';
            position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #444;
        }
    </style>
</head>
<body class="min-h-screen w-screen flex flex-col p-4 md:p-6 overflow-auto">
    <div id="root" class="h-full flex flex-col w-full max-w-[1600px] mx-auto gap-6 relative"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = window.location.origin;

        const AI_ROLES = [
            { id: 'scout', name: 'นักข่าว (RSS Scout)', image: 'assets/avatars/researcher.png', dept: 'Core' },
            { id: 'brain', name: 'นักเขียน (Mistral)', image: 'assets/avatars/executor.png', dept: 'Post' },
            { id: 'guardian', name: 'ตรวจสอบ (Guardian)', image: 'assets/avatars/guardian.png', dept: 'Core' },
            { id: 'anti', name: 'กราฟิก (Creatomate)', image: 'assets/avatars/guardian.png', dept: 'Post' },
            { id: 'publisher', name: 'โพสต์ (FB/IG)', image: 'assets/avatars/summarizer.png', dept: 'Post' },
            { id: 'voice', name: 'พากย์เสียง (ElevenLabs)', image: 'assets/avatars/router.png', dept: 'Reels' },
            { id: 'pexel', name: 'หาคลิป (Pexels)', image: 'assets/avatars/researcher.png', dept: 'Reels' }
        ];

        const App = () => {
            const [time, setTime] = useState('');
            const [chatInput, setChatInput] = useState('');

            // Agent States Array
            const [agents, setAgents] = useState(AI_ROLES.map(r => ({
                id: r.id, status: '[SLEEP]', dot: 'dot-gray', msg: 'Offline'
            })));

            // Panel states
            const [showPanel, setShowPanel] = useState(null); // 'agents' | 'memory' | 'train' | null
            const [agentList, setAgentList] = useState([]);
            const [allMemory, setAllMemory] = useState({});
            const [trainAgent, setTrainAgent] = useState('');
            const [trainFeedback, setTrainFeedback] = useState('');
            const [trainResult, setTrainResult] = useState('');
            const [pmChatInput, setPmChatInput] = useState('');
            const [pmChatLogs, setPmChatLogs] = useState([]);
            const [pmChatLoading, setPmChatLoading] = useState(false);

            const [pipelineRunning, setPipelineRunning] = useState(false);
            const [tokenData, setTokenData] = useState([]);
            const [schedulerOn, setSchedulerOn] = useState(false);
            const [postMode, setPostMode] = useState('approve');
            const [pendingPosts, setPendingPosts] = useState([]);
            const [analytics, setAnalytics] = useState([]);
            const [showAnalytics, setShowAnalytics] = useState(false);
            const [rejectingKey, setRejectingKey] = useState(null); // "batchId-itemIdx"
            const [rejectReason, setRejectReason] = useState('');
            const [approvingKey, setApprovingKey] = useState(null); // "batchId-itemIdx"

            const [chatLogs, setChatLogs] = useState([
                { sysTime: 'SYS', agent: 'System', msg: 'Pang Game Company v1.1 OS Booted.', isSys: true }
            ]);

            const logsEndRef = useRef(null);

            // Fetch analytics
            const fetchAnalytics = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/analytics?limit=10');
                    const data = await res.json();
                    if (Array.isArray(data)) setAnalytics(data);
                } catch(e) {}
            };

            // Fetch post mode
            const fetchPostMode = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/postmode');
                    const data = await res.json();
                    setPostMode(data.mode);
                } catch(e) {}
            };

            // Toggle post mode
            const togglePostMode = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/postmode', { method: 'POST' });
                    const data = await res.json();
                    setPostMode(data.mode);
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: data.mode === 'auto' ? 'เปลี่ยนเป็น: โพสต์เลย' : 'เปลี่ยนเป็น: ถามก่อน', isSys: true }]);
                } catch(e) {}
            };

            // Fetch pending posts
            const fetchPending = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/pending');
                    const data = await res.json();
                    setPendingPosts(data);
                } catch(e) {}
            };

            // Approve pending post (per-item)
            const approvePending = async (batchId, itemIdx) => {
                const key = batchId + '-' + itemIdx;
                if (approvingKey) return; // ป้องกันกดซ้ำ
                setApprovingKey(key);
                try {
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'Admin', msg: 'อนุมัติโพสต์ กำลังโพสต์...', isAdmin: true }]);
                    const res = await fetch(API_BASE + '/api/pending/' + batchId + '/approve?item=' + itemIdx, { method: 'POST' });
                    const data = await res.json();
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: data.msg || data.error, isSys: true }]);
                    fetchPending();
                } catch(e) {
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: 'อนุมัติล้มเหลว: ' + (e.message || 'Unknown error'), isSys: true }]);
                } finally {
                    setApprovingKey(null);
                }
            };

            // Reject pending post — step 1: กดไม่เอา → โชว์ช่องเหตุผล (per-item)
            const startReject = (batchId, itemIdx) => {
                setRejectingKey(batchId + '-' + itemIdx);
                setRejectReason('');
            };

            // Reject pending post — step 2: ส่งเหตุผล → ลบ + เทรนนักเขียน
            const confirmReject = async (batchId, itemIdx) => {
                const reason = rejectReason.trim();
                setRejectingKey(null);
                setRejectReason('');
                try {
                    await fetch(API_BASE + '/api/pending/' + batchId + '/reject?item=' + itemIdx, { method: 'POST' });
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'Admin', msg: 'ไม่อนุมัติ: ' + (reason || 'ไม่ระบุ'), isAdmin: true }]);
                    if (reason) {
                        try {
                            await fetch(API_BASE + '/api/train', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ agent: 'writer.json', feedback: reason })
                            });
                            setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'PM', msg: 'เทรนนักเขียนแล้ว: "' + reason + '"' }]);
                        } catch(te) {}
                    }
                    fetchPending();
                } catch(e) {}
            };

            // Fetch scheduler status
            const fetchScheduler = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/scheduler');
                    const data = await res.json();
                    setSchedulerOn(data.status === 'running');
                } catch(e) { /* ignore */ }
            };

            // Toggle scheduler
            const toggleScheduler = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/scheduler', { method: 'POST' });
                    const data = await res.json();
                    setSchedulerOn(data.status === 'running');
                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'Scheduler', msg: data.msg, isSys: true }]);
                } catch(e) { /* ignore */ }
            };

            // Fetch token status
            const fetchTokens = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/tokens');
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) setTokenData(data);
                    else if (tokenData.length === 0) setTokenData([
                        { name: 'Mistral Large', role: 'PM + นักเขียน', status: 'checking', tier: 'FREE', color: 'orange' },
                        { name: 'Ayrshare', role: 'โพสต์ FB + IG', status: 'checking', tier: 'FREE', color: 'blue' },
                        { name: 'RSS Feeds', role: 'นักข่าว', status: 'active', tier: 'FREE', color: 'teal' },
                    ]);
                } catch(e) {
                    if (tokenData.length === 0) setTokenData([
                        { name: 'Mistral Large', role: 'PM + นักเขียน', status: 'offline', tier: 'FREE', color: 'orange' },
                        { name: 'Ayrshare', role: 'โพสต์ FB + IG', status: 'offline', tier: 'FREE', color: 'blue' },
                        { name: 'RSS Feeds', role: 'นักข่าว', status: 'active', tier: 'FREE', color: 'teal' },
                    ]);
                }
            };

            // Fetch agents list
            const fetchAgents = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/agents');
                    const data = await res.json();
                    setAgentList(data);
                } catch(e) { setAgentList([]); }
            };

            // Fetch all memory
            const fetchMemory = async () => {
                try {
                    const res = await fetch(API_BASE + '/api/memory');
                    const data = await res.json();
                    setAllMemory(data);
                } catch(e) { setAllMemory({}); }
            };

            // Train agent
            const handleTrain = async () => {
                if (!trainAgent || !trainFeedback.trim()) return;
                try {
                    const res = await fetch(API_BASE + '/api/train', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ agent: trainAgent, feedback: trainFeedback })
                    });
                    const data = await res.json();
                    setTrainResult(`เทรน ${data.name} สำเร็จ! memory: ${data.memoryCount} รายการ`);
                    setTrainFeedback('');
                    fetchMemory();
                } catch(e) { setTrainResult('เทรนไม่สำเร็จ'); }
            };

            // Chat with PM
            const handlePmChat = async () => {
                if (!pmChatInput.trim() || pmChatLoading) return;
                const msg = pmChatInput.trim();
                setPmChatLogs(prev => [...prev, { from: 'admin', text: msg }]);
                setPmChatInput('');
                setPmChatLoading(true);
                try {
                    const res = await fetch(API_BASE + '/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: msg })
                    });
                    const data = await res.json();
                    let reply = data.reply || data.text || JSON.stringify(data);
                    if (data.trained) reply += '\n\n(PM เทรนพนักงานแล้ว)';
                    setPmChatLogs(prev => [...prev, { from: 'pm', text: reply }]);
                } catch(e) {
                    setPmChatLogs(prev => [...prev, { from: 'pm', text: 'Error: ติดต่อ PM ไม่ได้' }]);
                }
                setPmChatLoading(false);
            };

            // Run pipeline (fire-and-forget + poll → push to Briefing Room)
            const lastLogLines = useRef(0);
            const handleRunPipeline = async () => {
                if (pipelineRunning) return;
                setPipelineRunning(true);
                lastLogLines.current = 0;
                // ลบ pending เก่าก่อน run ใหม่
                try { await fetch(API_BASE + '/api/pending/clear', { method: 'POST' }); } catch(e) {}
                setPendingPosts([]);
                const now = new Date();
                setChatLogs(prev => [...prev, { sysTime: `${now.getHours()}:${now.getMinutes()}`, agent: 'Admin', msg: '!run pipeline', isAdmin: true }]);
                try {
                    await fetch(API_BASE + '/api/run', { method: 'POST' });

                    // Map ชื่อพนักงานใน log → agent id
                    const ROLE_MAP = {
                        'PM': null,
                        'นักข่าว': 'scout',
                        'นักเขียน': 'brain',
                        'ตรวจสอบ': 'guardian',
                        'กราฟิก': 'anti',
                        'โพสต์': 'publisher',
                    };

                    // เปิดไฟทุกคนเป็น STANDBY ก่อน
                    setAgents(prev => prev.map(a => ({ ...a, status: '[STANDBY]', dot: 'dot-gray', msg: 'รอคำสั่ง...' })));

                    // Safety timeout: ถ้า 5 นาทียังไม่เสร็จ reset ปุ่ม
                    const safetyTimeout = setTimeout(() => {
                        setPipelineRunning(false);
                        setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: 'System', msg: 'Pipeline timeout — reset ปุ่ม', isSys: true }]);
                        setAgents(prev => prev.map(a => ({ ...a, status: '[SLEEP]', dot: 'dot-gray', msg: 'Offline' })));
                    }, 5 * 60 * 1000);

                    // Poll status ทุก 3 วินาที → push log ใหม่เข้า chat + อัพเดต agent
                    const poll = setInterval(async () => {
                        try {
                            const sr = await fetch(API_BASE + '/api/run/status');
                            const st = await sr.json();
                            const lines = (st.log || '').split('\n').filter(l => l.trim());
                            const newLines = lines.slice(lastLogLines.current);
                            lastLogLines.current = lines.length;
                            for (const line of newLines) {
                                const m = line.match(/\[.*?\]\s*\[(.+?)\]\s*(.*)/);
                                if (m) {
                                    const role = m[1];
                                    const msg = m[2];
                                    setChatLogs(prev => [...prev, { sysTime: 'SYS', agent: role, msg: msg }]);

                                    // PM สั่งงานพนักงาน → activate agent นั้น
                                    const assignMatch = msg.match(/สั่งงาน\s+(.+?)\.\.\./);
                                    if (assignMatch) {
                                        const targetId = ROLE_MAP[assignMatch[1]];
                                        if (targetId) {
                                            setAgents(prev => prev.map(a =>
                                                a.id === targetId ? { ...a, status: '[ACTIVE]', dot: 'dot-orange', msg: 'กำลังทำงาน...' } : a
                                            ));
                                        }
                                    }

                                    // อัพเดต agent status จาก log ของพนักงานเอง
                                    const agentId = ROLE_MAP[role];
                                    if (agentId) {
                                        const isDone = msg.includes('SUCCESS') || msg.includes('DONE');
                                        const isFail = msg.includes('FAILED') || msg.includes('ล้มเหลว') || msg.includes('SKIPPED');
                                        setAgents(prev => prev.map(a => {
                                            if (a.id === agentId) {
                                                return {
                                                    ...a,
                                                    status: isDone ? '[DONE]' : isFail ? '[FAIL]' : '[ACTIVE]',
                                                    dot: isDone ? 'dot-green' : isFail ? 'dot-red' : 'dot-orange',
                                                    msg: msg.slice(0, 40)
                                                };
                                            }
                                            return a;
                                        }));
                                    }
                                }
                            }
                            if ((st.status || '').trim() !== 'running') {
                                clearInterval(poll);
                                clearTimeout(safetyTimeout);
                                setPipelineRunning(false);

                                                  className: 'flex-1 py-3 bg-gray-100 text-red-500 font-bold text-sm hover:bg-gray-200 transition-colors'
                                                }, 'ไม่เอา')
                                              );
                                            })()
                                        );
                                    });
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        /* Pending posts ย้ายมาอยู่ inline แล้ว */

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
