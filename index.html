<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANG NEWS CO. — Virtual Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-out-quart:cubic-bezier(0.25,1,0.5,1);
  --dur-fast:140ms;--dur-normal:220ms;--dur-slow:320ms;
  --z-bars:10;--z-overlay:50;--z-panel:51;--z-notif:100;
  /* dark navy "control room" chrome (like WORK360) */
  --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0d1422;--panel-3:#0a1120;
  --line:#243150;--line-soft:#1a2540;
  --ink:#eaf0fb;--ink-dim:#c3cfe6;--muted:#8195b8;
  --cyan:#4fd3ff;--gold:#ffd54f;--good:#3ddc84;--bad:#ff6b6b;--warn:#ffb454;
  /* role accents */
  --c-pm:#ff5a52;--c-reporter:#3aa0ff;--c-writer:#46c46a;--c-guardian:#b06cff;--c-graphic:#ff9838;--c-publisher:#ffd23f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:'DotGothic16',monospace;color:var(--ink);width:100vw;height:100vh}
canvas#office{position:fixed;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0}
#ui{position:fixed;inset:0;pointer-events:none;z-index:1}
#ui>*{pointer-events:auto}
.pixel{font-family:'Press Start 2P',monospace}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ===================== TOP BAR ===================== */
.top-bar{position:fixed;top:0;left:0;right:0;height:60px;z-index:var(--z-bars);
  background:linear-gradient(180deg,#101a30 0%,#0b1322 100%);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 16px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:7px;background:linear-gradient(135deg,#1d2c4d,#0e1830);
  border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 12px #4fd3ff44}
.brand .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .bt .n{font-family:'Press Start 2P',monospace;font-size:11px;color:#fff;text-shadow:0 0 8px #4fd3ff66;white-space:nowrap}
.brand .bt .s{font-size:10px;color:var(--cyan)}
.tb-spacer{flex:1}
.tb-pill{display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:20px;padding:5px 12px;font-size:11px;color:var(--ink-dim);white-space:nowrap}
.tb-pill .led{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:pulseLed 2s infinite}
@keyframes pulseLed{0%,100%{opacity:1}50%{opacity:.4}}
.tb-clock{text-align:right;line-height:1.25}
.tb-clock .d{font-size:10px;color:var(--muted)}
.tb-clock .t{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold)}
.tb-bell{position:relative;width:38px;height:38px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all var(--dur-fast)}
.tb-bell:hover{border-color:var(--gold);transform:translateY(-1px)}
.tb-bell .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:9px;
  min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:'Press Start 2P',monospace;padding:0 4px}

/* ===================== LEFT SIDEBAR ===================== */
.sidebar-l{position:fixed;left:0;top:60px;bottom:0;width:210px;z-index:var(--z-bars);
  background:linear-gradient(180deg,#0e1626 0%,#0a0f1c 100%);border-right:2px solid var(--line);
  display:flex;flex-direction:column;padding:12px 10px;gap:6px;overflow-y:auto}
.nav-group-label{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);padding:4px 6px 2px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--ink-dim);font-family:inherit;font-size:13px;
  width:100%;text-align:left;transition:all var(--dur-fast) var(--ease-out-quart);position:relative}
.nav-item:hover{background:var(--panel);border-color:var(--line)}
.nav-item.active{background:linear-gradient(90deg,#16335a,#102544);border-color:var(--cyan);color:#fff;box-shadow:inset 3px 0 0 var(--cyan)}
.nav-item:disabled{opacity:.55;cursor:not-allowed}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item .nb{margin-left:auto;background:var(--bad);color:#fff;border-radius:8px;font-size:9px;
  font-family:'Press Start 2P',monospace;padding:2px 6px;min-width:18px;text-align:center}
.nav-item.run{border-color:#1f5e3a;background:#10331f;color:#7be6a0}
.nav-item.run:hover:not(:disabled){background:#164a2a;border-color:var(--good)}
.spacer-grow{flex:1;min-height:8px}
.office-status{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:6px}
.office-status .h{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--cyan);margin-bottom:9px;letter-spacing:.5px}
.os-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:4px 0;color:var(--muted)}
.os-row b{color:var(--ink);font-size:11px}
.os-row .ok{color:var(--good);font-family:'Press Start 2P',monospace;font-size:8px}
.mode-toggle{margin-top:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--gold);
  font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer;transition:all var(--dur-fast)}
.mode-toggle:hover{border-color:var(--gold);background:#1a1a0e}

/* ===================== RIGHT SIDEBAR (directory) ===================== */
.sidebar-r{position:fixed;right:0;top:60px;bottom:0;width:248px;z-index:var(--z-bars);
  background:linear-gradient(180deg,#0e1626 0%,#0a0f1c 100%);border-left:2px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.dir-head{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--cyan);padding:13px 14px 10px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.dir-head .c{color:var(--muted);font-size:8px}
.dir-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px}
.dir-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--line-soft);cursor:pointer;transition:all var(--dur-fast) var(--ease-out-quart);
  width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.dir-row:hover{border-color:var(--gold);transform:translateX(-3px)}
.dir-num{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);width:14px;text-align:center;flex:0 0 auto}
.dir-av{width:30px;height:30px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:15px;border:2px solid;background:#0c1322}
.dir-meta{flex:1;min-width:0}
.dir-name{font-family:'Press Start 2P',monospace;font-size:8px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-role{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-lv{font-size:9px;color:var(--gold);margin-left:4px}
.dir-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dir-dot.on{background:var(--good);box-shadow:0 0 7px var(--good)}
.dir-dot.busy{background:var(--cyan);box-shadow:0 0 7px var(--cyan)}
.dir-dot.idle{background:var(--warn)}
.dir-foot{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel-3)}
.dir-foot .all{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--good);margin-bottom:9px}
.sys-row{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);padding:3px 0}
.sys-row .ck{color:var(--good);font-size:11px}

/* ===================== BOTTOM BAR (stat cards) ===================== */
.bottom-bar{position:fixed;left:210px;right:248px;bottom:0;height:104px;z-index:var(--z-bars);
  background:linear-gradient(0deg,#0b1322 0%,#0e1828 100%);border-top:2px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:0 16px;overflow-x:auto}
.stat-tile{flex:0 0 auto;min-width:118px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;
  font-family:inherit;text-align:left;cursor:pointer;transition:transform var(--dur-fast) var(--ease-out-quart),border-color var(--dur-fast)}
.stat-tile:hover{transform:translateY(-2px);border-color:var(--accent,#4fd3ff)}
.stat-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,#4fd3ff)}
.stat-tile .big{font-family:'Press Start 2P',monospace;font-size:18px;color:var(--accent,#fff)}
.stat-tile .lb{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat-tile .ic2{position:absolute;right:10px;top:9px;font-size:18px;opacity:.5}
.automation{flex:1 0 auto;min-width:210px;margin-left:auto;background:linear-gradient(110deg,#10325a,#0c1d38);
  border:1px solid var(--cyan);border-radius:10px;padding:10px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:inset 0 0 22px #4fd3ff1a;font-family:inherit;text-align:left;cursor:pointer;transition:transform var(--dur-fast) var(--ease-out-quart),filter var(--dur-fast)}
.automation:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.12)}
.automation:disabled{cursor:default}
.emp-card{cursor:pointer}.emp-card:hover{border-color:var(--gold)}
.automation .bot{font-size:30px;filter:drop-shadow(0 0 8px #4fd3ff66)}
.automation .at{flex:1}
.automation .at .t{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--cyan);margin-bottom:5px}
.automation .at .s{font-size:11px;color:var(--ink-dim)}

/* pipeline strip overlays bottom bar when running */
.pipeline{position:fixed;left:210px;right:248px;bottom:104px;z-index:var(--z-bars);
  background:linear-gradient(0deg,#0a1120 0%,#0e1828 100%);border-top:1px solid var(--line);
  padding:6px 14px;display:flex;align-items:center;gap:5px;justify-content:center;flex-wrap:wrap}
.pipeline .plabel{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);margin-right:6px}
.pstep{display:flex;align-items:center;gap:6px}
.pstep .chip{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel-2);font-size:11px;color:var(--muted);transition:all var(--dur-normal) var(--ease-out-quart)}
.pstep .chip .n{font-family:'Press Start 2P',monospace;font-size:8px}
.pstep.done .chip{border-color:#235c3a;color:var(--good);background:#10331f}
.pstep.active .chip{border-color:var(--gold);color:var(--gold);background:#1d1a0a;box-shadow:0 0 0 2px #ffd54f33;transform:translateY(-2px)}
.pstep .arrow{color:var(--line);font-size:12px}
.pstep.done .arrow{color:#235c3a}

/* ===================== compact toolbar (mobile) ===================== */
.toolbar-c{display:none}

/* ===================== NOTIFICATIONS ===================== */
.notif{position:fixed;top:70px;right:260px;z-index:var(--z-notif);display:flex;flex-direction:column;gap:8px;pointer-events:none}
@keyframes notifLife{0%{transform:translateX(115%);opacity:0}7%{transform:translateX(0);opacity:1}90%{transform:translateX(0);opacity:1}100%{transform:translateX(115%);opacity:0}}
.notif-card{background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--gold);
  box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:280px;display:flex;align-items:center;gap:8px;animation:notifLife 4s var(--ease-out-expo) forwards}
.notif-card::before{content:'';flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}

/* ===================== PANELS (modals) ===================== */
.panel-overlay{position:fixed;inset:0;background:rgba(4,7,14,.72);backdrop-filter:blur(3px);z-index:var(--z-overlay);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn var(--dur-normal) var(--ease-out-quart)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.panel{position:relative;z-index:var(--z-panel);background:var(--panel);border:2px solid var(--line);border-radius:12px;
  max-width:560px;width:100%;max-height:85vh;overflow-y:auto;animation:slideUp var(--dur-slow) var(--ease-out-expo);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.panel-title{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--cyan);padding:14px 16px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center}
.panel-body{padding:14px 16px}
.panel::-webkit-scrollbar,.dir-list::-webkit-scrollbar,.sidebar-l::-webkit-scrollbar,.chat-box::-webkit-scrollbar,.log-box::-webkit-scrollbar,.bottom-bar::-webkit-scrollbar{width:8px;height:8px}
.panel::-webkit-scrollbar-thumb,.dir-list::-webkit-scrollbar-thumb,.sidebar-l::-webkit-scrollbar-thumb,.chat-box::-webkit-scrollbar-thumb,.log-box::-webkit-scrollbar-thumb,.bottom-bar::-webkit-scrollbar-thumb{background:#2c3a5c;border-radius:4px}

.btn-game{font-family:'Press Start 2P',monospace;font-size:9px;padding:9px 14px;border:2px solid;border-radius:7px;cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out-quart),filter var(--dur-fast),background var(--dur-fast);text-transform:uppercase;background:var(--panel-2);color:var(--ink)}
.btn-game:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.2)}
.btn-game:active:not(:disabled){transform:translateY(1px)}
.btn-game:disabled{opacity:.5;cursor:not-allowed}
.btn-close{border-color:var(--bad);color:var(--bad);font-size:8px;padding:7px 10px}.btn-close:hover{background:#ff6b6b22}
.btn-chat{border-color:#ff9800;color:#ff9800}.btn-chat:hover:not(:disabled){background:#ff980022}
.btn-train{border-color:#e91e63;color:#e91e63}.btn-train:hover:not(:disabled){background:#e91e6322}
.btn-analytics{border-color:#7e57c2;color:#b39ddb}.btn-analytics:hover:not(:disabled){background:#7e57c222}
.btn-ok{border-color:var(--good);color:var(--good)}.btn-ok:hover:not(:disabled){background:#3ddc8422}
.btn-no{border-color:var(--bad);color:var(--bad)}.btn-no:hover:not(:disabled){background:#ff6b6b22}
.badge-count{background:var(--bad);color:#fff;border-radius:8px;padding:1px 6px;margin-left:6px;font-size:8px}

.emp-card{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.emp-avatar{width:38px;height:38px;border-radius:8px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.emp-info{flex:1;min-width:0}
.emp-name{font-family:'Press Start 2P',monospace;font-size:9px;margin-bottom:4px}
.emp-role{font-size:11px;color:var(--muted)}
.emp-stars{color:var(--gold);font-size:12px;letter-spacing:2px}

.chat-box{background:var(--panel-3);border:1px solid var(--line);border-radius:8px;height:230px;overflow-y:auto;padding:10px;margin-bottom:8px}
.chat-msg{margin-bottom:7px;font-size:12px;line-height:1.45}
.chat-msg.pm{color:#ffb74d}.chat-msg.user{color:var(--cyan)}.chat-msg.sys{color:#b39ddb;font-style:italic}
.chat-input,.train-select,.train-textarea{width:100%;background:var(--panel-3);border:1px solid var(--line);border-radius:7px;
  padding:9px;color:var(--ink);font-family:inherit;font-size:13px;outline:none}
.chat-input:focus,.train-select:focus,.train-textarea:focus{border-color:var(--cyan)}
.train-select{margin-bottom:8px}.train-textarea{resize:vertical;min-height:64px;margin-bottom:8px}
.train-select option{background:var(--panel-2)}

.log-box{background:var(--panel-3);border:1px solid var(--line);border-radius:8px;height:300px;overflow-y:auto;padding:10px}
.log-line{font-size:11px;margin-bottom:4px;padding:2px 0;border-bottom:1px solid var(--line-soft);color:#a5d6a7}
.log-line.err{color:#ef9a9a}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:30px 16px;text-align:center;color:var(--muted)}
.empty-state .icon{font-size:32px;opacity:.85}
.empty-state .head{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--ink-dim)}
.empty-state .sub{font-size:12px;line-height:1.5;max-width:34ch}
.skeleton{background:linear-gradient(90deg,#16203780 25%,#22305280 37%,#16203780 63%);background-size:400% 100%;animation:shimmer 1.4s var(--ease-out-quart) infinite;border-radius:7px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.skel-card{height:60px;margin-bottom:8px}

.status-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-family:'Press Start 2P',monospace}
.status-auto{background:#10331f;color:var(--good);border:1px solid #235c3a}
.status-running{background:#1d1a0a;color:var(--gold);border:1px solid #5c4e23}

.pending-card{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px}
.pending-card img{width:100%;max-height:170px;object-fit:cover;border-radius:7px;border:1px solid var(--line);margin-bottom:8px;background:var(--panel-3)}
.pending-head{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);line-height:1.6;margin-bottom:6px}
.pending-cap{font-size:12px;line-height:1.5;color:var(--ink-dim);white-space:pre-wrap;max-height:120px;overflow-y:auto;margin-bottom:6px}
.pending-src{font-size:10px;color:var(--muted);margin-bottom:8px}
.pending-actions{display:flex;gap:8px}.pending-actions .btn-game{flex:1;font-size:8px;padding:10px}
.stat-card{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;display:flex;gap:10px}
.stat-card img{width:60px;height:60px;object-fit:cover;border-radius:7px;flex:0 0 auto;background:var(--panel-3)}
.sc-body{flex:1;min-width:0}
.stat-msg{font-size:12px;color:var(--ink-dim);line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
.stat-row b{color:var(--ink);font-family:'Press Start 2P',monospace;font-size:9px;margin-right:3px}
.sc-link{font-size:11px;color:var(--cyan);text-decoration:none;display:inline-block;margin-top:5px}.sc-link:hover{text-decoration:underline}

/* ----- Employee profile ----- */
.prof-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.prof-av{width:54px;height:54px;border-radius:12px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;background:var(--panel-3)}
.prof-id{flex:1;min-width:0}
.prof-name{font-family:'Press Start 2P',monospace;font-size:13px;margin-bottom:6px}
.prof-sub{font-size:11px;color:var(--muted)}
.prof-lv{display:inline-block;font-family:'Press Start 2P',monospace;font-size:8px;color:#1a1208;background:var(--gold);border-radius:5px;padding:3px 7px;margin-top:6px}
.prof-xpwrap{margin-bottom:12px}
.prof-xpbar{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:5px}
.prof-xpbar>div{height:10px;border-radius:5px;transition:width var(--dur-slow) var(--ease-out-expo)}
.prof-xplabel{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.prof-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.prof-stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 6px;text-align:center}
.prof-stat .v{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--ink)}
.prof-stat .k{font-size:9px;color:var(--muted);margin-top:4px}
.sect-label{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--cyan);margin:4px 0 8px;display:flex;align-items:center;gap:7px}
.sect-label .c{color:var(--muted);font-size:8px}
.lesson{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.lesson-meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:5px}
.lesson-meta .from{color:var(--gold)}
.lesson-txt{font-size:12px;line-height:1.5;color:var(--ink-dim)}
.prof-actions{display:flex;gap:8px;margin-top:6px}.prof-actions .btn-game{flex:1}

/* ----- Team activity feed ----- */
.feed{background:var(--panel-3);border:1px solid var(--line);border-radius:8px;max-height:50vh;overflow-y:auto;padding:10px}
.feed-line{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.feed-line:last-child{border-bottom:none}
.feed-av{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid var(--line);background:var(--panel-2)}
.feed-body{flex:1;min-width:0}
.feed-who{font-family:'Press Start 2P',monospace;font-size:8px;margin-bottom:3px}
.feed-txt{font-size:12px;line-height:1.45;color:var(--ink-dim)}
.feed-t{font-size:9px;color:var(--muted);flex:0 0 auto}

/* ===================== RESPONSIVE ===================== */
@media (max-width:1180px){
  .sidebar-l,.sidebar-r{display:none}
  .bottom-bar{left:0;right:0}
  .pipeline{left:0;right:0}
  .notif{right:16px}
  .toolbar-c{display:flex;position:fixed;top:60px;left:0;right:0;z-index:var(--z-bars);gap:7px;padding:8px 10px;overflow-x:auto;
    background:#0b1322;border-bottom:1px solid var(--line)}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .notif-card{animation:none;opacity:1;transform:none}
  .skeleton{animation:none;background:#1a2440}
  .tb-pill .led{animation:none}
}

<body>
<canvas id="office"></canvas>
<div id="ui"><div id="root"></div></div>

<script>
// ===================== VIRTUAL OFFICE ENGINE =====================
const canvas=document.getElementById('office');
const ctx=canvas.getContext('2d');
if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,r){if(typeof r==='number')r=[r,r,r,r];this.moveTo(x+r[0],y);this.lineTo(x+w-r[1],y);this.arcTo(x+w,y,x+w,y+r[1],r[1]);this.lineTo(x+w,y+h-r[2]);this.arcTo(x+w,y+h,x+w-r[2],y+h,r[2]);this.lineTo(x+r[3],y+h);this.arcTo(x,y+h,x,y+h-r[3],r[3]);this.lineTo(x,y+r[0]);this.arcTo(x,y,x+r[0],y,r[0]);return this;};}

const TILE=40, COLS=20, ROWS=14;
const GW=COLS*TILE, GH=ROWS*TILE; // 800 x 560

const PAL={
  floor1:'#caa46e',floor2:'#bd9760',floorLine:'#a8854f',
  wall:'#5a4636',wallTop:'#7a5f48',wallDark:'#2c2018',wallBase:'#241a12',wallEdge:'#9c7a5a',
  desk:'#b78457',deskTop:'#cd9d70',deskDark:'#8c6038',deskLeg:'#6b4628',
  screen:'#7fd4ff',screenGlow:'#c4ecff',screenFrame:'#1f262c',
  chair:'#4f3c2a',chairSeat:'#665033',
  plant:'#3f9450',plantHi:'#57b366',plantPot:'#bd6a3e',plantPotHi:'#d4824f',
  shadow:'rgba(20,12,5,0.22)',
  sky:'#8fd0ff',skyLow:'#cdecff',cloud:'#ffffff',sun:'#ffe08a',
  pm:'#ff5a52',reporter:'#3aa0ff',writer:'#46c46a',guardian:'#b06cff',graphic:'#ff9838',publisher:'#ffd23f',
  skin:'#ffce9e',skinSh:'#d99a64',hair:'#3d2a1c',hairLight:'#5a4030',
};

const GUT=20;
const RW=(GW-GUT)/2, RH=(GH-GUT)/2;
const WT=8, HH=26;
const ROOMS=[
  {id:'lead',    en:'LEADERSHIP CORE', th:'บริหาร',  color:PAL.pm,       x:0,      y:0,      w:RW, h:RH},
  {id:'news',    en:'NEWSROOM CORE',   th:'กองข่าว', color:PAL.reporter, x:RW+GUT, y:0,      w:RW, h:RH},
  {id:'review',  en:'REVIEW CORE',     th:'ตรวจสอบ', color:PAL.guardian, x:0,      y:RH+GUT, w:RW, h:RH},
  {id:'creative',en:'CREATIVE CORE',   th:'ครีเอทีฟ',color:PAL.graphic,  x:RW+GUT, y:RH+GUT, w:RW, h:RH},
];

const TEAM=[
  {id:'pm',       file:'pm.json',       name:'PM',       role:'ผู้จัดการ',    icon:'👔',roomId:'lead'},
  {id:'reporter', file:'reporter.json', name:'นักข่าว',  role:'หาข่าว',       icon:'📰',roomId:'news'},
  {id:'writer',   file:'writer.json',   name:'นักเขียน', role:'เขียนแคปชั่น', icon:'✍️',roomId:'news'},
  {id:'guardian', file:'guardian.json', name:'ตรวจสอบ',  role:'ตรวจคุณภาพ',   icon:'🔍',roomId:'review'},
  {id:'graphic',  file:'graphic.json',  name:'กราฟิก',   role:'ทำภาพ',        icon:'🎨',roomId:'creative'},
  {id:'publisher',file:'publisher.json',name:'โพสต์',    role:'ลงเพจ',        icon:'📱',roomId:'creative'},
];

const reduceMotionMQ=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
let prefersReduced=reduceMotionMQ.matches;
reduceMotionMQ.addEventListener&&reduceMotionMQ.addEventListener('change',e=>{prefersReduced=e.matches;});

function chromeFor(w){
  if(w<1180) return {left:0,right:0,top:108,bottom:104};
  return {left:210,right:248,top:60,bottom:104};
}
let W,H,scale=1,OX=0,OY=0,CH={left:0,right:0,top:60,bottom:104};
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
  CH=chromeFor(W);
  const availW=Math.max(120,W-CH.left-CH.right);
  const availH=Math.max(120,H-CH.top-CH.bottom);
  scale=Math.min(availW/GW,availH/GH);
  OX=CH.left+(availW-GW*scale)/2;
  OY=CH.top+(availH-GH*scale)/2;
}
window.addEventListener('resize',resize);resize();

class Character{
  constructor(id,name,color,room,hx,hy){
    this.id=id;this.name=name;this.color=color;this.room=room;
    this.homeX=hx;this.homeY=hy;
    this.x=hx;this.y=hy;this.targetX=hx;this.targetY=hy;
    this.state='working';this.dir=0;this.frame=0;this.frameTick=0;
    this.wanderTimer=180+Math.random()*240;
    this.bubble=null;this.bubbleTimer=0;this.working=false;this.highlightTimer=0;
    this.desk={x:Math.round(hx-20),y:Math.round(hy-24)};
  }
  bounds(){const r=this.room;return {x0:r.x+WT+14,y0:r.y+HH+34,x1:r.x+r.w-WT-14,y1:r.y+r.h-WT-16};}
  update(){
    this.frameTick++;if(this.frameTick>8){this.frame=(this.frame+1)%6;this.frameTick=0;}
    if(this.bubbleTimer>0)this.bubbleTimer--;else this.bubble=null;
    if(this.highlightTimer>0)this.highlightTimer--;
    const dx=this.targetX-this.x,dy=this.targetY-this.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>2){
      const spd=1.1;
      this.x+=dx/dist*spd;this.y+=dy/dist*spd;this.state='walking';
      if(Math.abs(dx)>Math.abs(dy))this.dir=dx<0?1:2;else this.dir=dy<0?3:0;
    }else{
      this.x=this.targetX;this.y=this.targetY;
      if(this.state==='walking'){
        const atHome=Math.abs(this.x-this.homeX)<5&&Math.abs(this.y-this.homeY)<5;
        this.state=atHome?'working':'idle';
        if(this.state==='working')this.dir=0;
        this.wanderTimer=200+Math.random()*260;
      }
      this.wanderTimer--;
      if(this.wanderTimer<=0&&!this.working&&!prefersReduced){
        const atHome=Math.abs(this.x-this.homeX)<5&&Math.abs(this.y-this.homeY)<5;
        if(atHome){
          if(Math.random()<0.25){
            const b=this.bounds();
            this.targetX=b.x0+Math.random()*(b.x1-b.x0);
            this.targetY=b.y0+Math.random()*(b.y1-b.y0);
            this.state='walking';
          }else this.wanderTimer=320+Math.random()*360;
        }else{this.targetX=this.homeX;this.targetY=this.homeY;this.state='walking';}
      }
    }
  }
  showBubble(t,d){this.bubble=t;this.bubbleTimer=d||120;}
  say(t,d){this.bubble=t;this.bubbleTimer=d||220;}
  ping(){this.highlightTimer=72;this.showBubble('👋',72);}
  goHome(){this.targetX=this.homeX;this.targetY=this.homeY;this.working=true;}
  relax(){this.working=false;this.wanderTimer=60+Math.random()*100;}
}

const characters=[];const charById={};
ROOMS.forEach(room=>{
  const mem=TEAM.filter(t=>t.roomId===room.id);const N=mem.length;
  mem.forEach((t,k)=>{
    const cx=Math.round(room.x+room.w*(k+1)/(N+1));
    const cy=Math.round(room.y+HH+(room.h-HH)*0.60);
    const c=new Character(t.id,t.name,PAL[t.id],room,cx,cy);
    characters.push(c);charById[t.id]=c;
  });
});
window.characters=characters;
window.TEAM=TEAM;
window.pingCharacter=(id)=>{const c=charById[id];if(c)c.ping();};
window.getAgentStates=()=>characters.map(c=>({id:c.id,name:c.name,color:c.color,state:c.state,working:c.working}));
window.sayLine=(id,text,dur)=>{const c=charById[id];if(!c)return;c.say(text,dur);if(window.onAgentSay)window.onAgentSay(id,c.name,c.color,text);};

const AGENT_SPRITE={pm:'boss',reporter:'listing',writer:'dev',guardian:'tech',graphic:'marketing',publisher:'admin'};
const DIR_NAME=['down','left','right','up'];
const sprites={};
for(const type of Object.values(AGENT_SPRITE)){
  sprites[type]={};
  for(const d of DIR_NAME){const img=new Image();img.src='assets/sprites/agent-'+type+'-walk-'+d+'.png';sprites[type][d]=img;}
}

let particles=[];
function addParticle(x,y,color,text){particles.push({x,y,color,text,life:60,vy:-0.8,vx:(Math.random()-0.5)*0.5});}
window.addParticle=addParticle;

window.gameState={pipelineRunning:false,lastEvent:''};
function startPipelineAnim(){
  characters.forEach(c=>{c.goHome();c.showBubble('💪',90);});
  setTimeout(()=>characters.forEach((c,i)=>setTimeout(()=>c.showBubble('⚡',70),i*350)),1400);
}
function endPipelineAnim(ok){characters.forEach(c=>{c.relax();c.showBubble(ok?'🎉':'😢',100);if(ok)addParticle(c.x,c.y-30,'#ffd54f','✨');});}
window.startPipelineAnim=startPipelineAnim;window.endPipelineAnim=endPipelineAnim;

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

function drawRoomFloor(ix,iy,iw,ih){
  ctx.save();ctx.beginPath();ctx.rect(ix,iy,iw,ih);ctx.clip();
  const T=34;
  for(let r=0;r*T<ih+T;r++)for(let c=0;c*T<iw+T;c++){
    const px=ix+c*T,py=iy+r*T;
    ctx.fillStyle=((c+r)%2===0)?PAL.floor1:PAL.floor2;ctx.fillRect(px,py,T,T);
    ctx.fillStyle=PAL.floorLine;ctx.fillRect(px,py,T,1);ctx.fillRect(px,py,1,T);
  }
  ctx.fillStyle='rgba(0,0,0,0.10)';ctx.fillRect(ix,iy,iw,8);
  ctx.restore();
}
function drawBookshelf(x,y){
  ctx.fillStyle=PAL.shadow;ctx.fillRect(x+3,y+30,34,3);
  ctx.fillStyle=PAL.deskLeg;ctx.fillRect(x+2,y,36,30);
  ctx.fillStyle=PAL.wallBase;ctx.fillRect(x+4,y+2,32,26);
  const colors=['#e57373','#64b5f6','#81c784','#fff176','#ce93d8','#ffab91'];
  for(let r=0;r<3;r++){
    for(let b=0;b<4;b++){ctx.fillStyle=colors[(r*4+b+(x>>5))%colors.length];const bh=5+((b+r)%2)*2;ctx.fillRect(x+6+b*8,y+3+r*8+(7-bh),6,bh);}
    ctx.fillStyle=PAL.deskLeg;ctx.fillRect(x+4,y+10+r*8,32,2);
  }
}
function drawWindowPanel(x,y){
  const w=46,h=24;
  ctx.fillStyle=PAL.wallDark;ctx.fillRect(x-2,y-2,w+4,h+4);
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,PAL.sky);g.addColorStop(1,PAL.skyLow);
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle=PAL.cloud;ctx.fillRect(x+9,y+13,13,3);ctx.fillRect(x+12,y+9,8,3);
  ctx.fillStyle=PAL.sun;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(x+w-11,y+8,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=PAL.wallDark;ctx.fillRect(x+w/2-1,y,2,h);ctx.fillRect(x,y+h/2-1,w,2);
}
function drawPlant(x,y){
  ctx.fillStyle=PAL.shadow;ctx.fillRect(x+11,y+33,18,3);
  ctx.fillStyle=PAL.plantPot;ctx.fillRect(x+12,y+22,16,12);
  ctx.fillStyle=PAL.plantPotHi;ctx.fillRect(x+12,y+22,4,12);
  ctx.fillStyle=PAL.plantPot;ctx.fillRect(x+10,y+20,20,4);
  ctx.fillStyle=PAL.plant;
  ctx.beginPath();ctx.arc(x+20,y+15,10,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+14,y+13,6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+26,y+12,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=PAL.plantHi;
  ctx.beginPath();ctx.arc(x+17,y+11,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+24,y+10,3,0,Math.PI*2);ctx.fill();
}
function drawDesk(x,y){
  ctx.fillStyle=PAL.chair;ctx.fillRect(x+15,y+23,10,9);
  ctx.fillStyle=PAL.chairSeat;ctx.fillRect(x+15,y+21,10,4);
  ctx.fillStyle=PAL.shadow;ctx.fillRect(x+3,y+31,34,5);
  ctx.fillStyle=PAL.deskLeg;ctx.fillRect(x+5,y+30,3,6);ctx.fillRect(x+32,y+30,3,6);
  ctx.fillStyle=PAL.deskDark;ctx.fillRect(x+4,y+26,32,6);
  ctx.fillStyle=PAL.desk;ctx.fillRect(x+2,y+15,36,11);
  ctx.fillStyle=PAL.deskTop;ctx.fillRect(x+2,y+12,36,4);
  ctx.fillStyle=PAL.screenFrame;ctx.fillRect(x+11,y,18,14);
  ctx.fillStyle=PAL.screen;ctx.fillRect(x+13,y+2,14,9);
  ctx.fillStyle=PAL.screenGlow;ctx.fillRect(x+14,y+3,5,3);
  ctx.fillStyle='#4a4f55';ctx.fillRect(x+19,y+14,2,3);
  ctx.fillStyle=PAL.deskDark;ctx.fillRect(x+15,y+16,10,2);
  ctx.fillStyle='#3a3f44';ctx.fillRect(x+9,y+19,14,4);ctx.fillRect(x+26,y+19,4,3);
}
function drawRoom(room){
  const {x,y,w,h,color}=room;
  ctx.fillStyle='rgba(0,0,0,0.45)';rr(x+5,y+7,w,h,12);ctx.fill();
  ctx.fillStyle=PAL.wallDark;rr(x,y,w,h,12);ctx.fill();
  ctx.fillStyle=PAL.wall;rr(x+3,y+3,w-6,h-6,9);ctx.fill();
  const ix=x+WT,iy=y+HH,iw=w-2*WT,ih=h-HH-WT;
  ctx.save();rr(ix,iy,iw,ih,5);ctx.clip();drawRoomFloor(ix,iy,iw,ih);ctx.restore();
  drawBookshelf(ix+6,iy+4);drawBookshelf(ix+iw-44,iy+4);
  drawWindowPanel(ix+iw/2-23,iy+6);
  drawPlant(ix-2,iy+ih-38);drawPlant(ix+iw-38,iy+ih-38);
  const hg=ctx.createLinearGradient(0,y,0,y+HH);hg.addColorStop(0,shade(color,38));hg.addColorStop(1,color);
  ctx.fillStyle=hg;ctx.beginPath();ctx.roundRect(x,y,w,HH,[12,12,0,0]);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';ctx.fillRect(x+4,y+2,w-8,1);
  ctx.font='8px "Press Start 2P"';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillText(room.en,x+13,y+HH/2+1);
  ctx.fillStyle='#fff';ctx.fillText(room.en,x+12,y+HH/2);
  ctx.textBaseline='alphabetic';
  const anyWorking=characters.some(c=>c.room===room&&c.state!=='idle');
  ctx.fillStyle=anyWorking?'#9dffc4':'#ffd98a';
  ctx.beginPath();ctx.arc(x+w-16,y+HH/2,3.5,0,Math.PI*2);ctx.fill();
}

function drawCharacter(c){
  const s=2;const walk=c.state==='walking';const f=c.frame;
  const bob=(walk||prefersReduced)?0:(Math.sin(tick*0.07+c.homeX*0.13)>0.3?-1:0);
  const hl=c.highlightTimer>0;
  const jump=hl?-Math.abs(Math.sin((72-c.highlightTimer)*0.26))*5:0;
  const bx=c.x-5*s,by=c.y-8*s+bob+jump;
  const dark=shade(c.color,-45),lite=shade(c.color,35);
  if(hl){ctx.strokeStyle='#ffd54f';ctx.lineWidth=2;ctx.globalAlpha=0.4+0.4*Math.sin(c.highlightTimer*0.4);ctx.beginPath();ctx.ellipse(c.x,c.y+8*s,9*s,3.2*s,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
  ctx.fillStyle=PAL.shadow;ctx.beginPath();ctx.ellipse(c.x,c.y+8*s,6*s,2.2*s,0,0,Math.PI*2);ctx.fill();
  const sprType=AGENT_SPRITE[c.id];
  const sprImg=sprType&&sprites[sprType]&&sprites[sprType][DIR_NAME[c.dir]||'down'];
  if(sprImg&&sprImg.complete&&sprImg.naturalWidth>0){
    const FR=64,SPR=46;const fr=walk?(c.frame%6):0;ctx.imageSmoothingEnabled=false;
    ctx.drawImage(sprImg,fr*FR,0,FR,FR,Math.round(c.x-SPR/2),Math.round(c.y+12-SPR+bob+jump),SPR,SPR);
  }else{
    ctx.fillStyle='#3a4046';const legOff=walk?(f%2===0?2:-2):0;
    ctx.fillRect(bx+2*s,by+11*s+Math.max(0,legOff),2*s,4*s);ctx.fillRect(bx+6*s,by+11*s+Math.max(0,-legOff),2*s,4*s);
    const armOff=(c.state==='working'&&f%2===0)?-1:0;ctx.fillStyle=dark;
    ctx.fillRect(bx-1*s,by+7*s+armOff,2*s,4*s);ctx.fillRect(bx+9*s,by+7*s-armOff,2*s,4*s);
    ctx.fillStyle=dark;ctx.fillRect(bx+1*s-1,by+6*s,8*s+2,6*s+1);
    ctx.fillStyle=c.color;ctx.fillRect(bx+1*s,by+6*s,8*s,6*s);
    ctx.fillStyle=lite;ctx.fillRect(bx+1*s,by+6*s,8*s,1*s);ctx.fillStyle=dark;ctx.fillRect(bx+1*s,by+11*s,8*s,1*s);
    ctx.fillStyle=PAL.hair;ctx.fillRect(bx+1*s-1,by,8*s+2,6*s);
    ctx.fillStyle=PAL.skin;ctx.fillRect(bx+1*s,by+1*s,8*s,5*s);
    ctx.fillStyle=PAL.skinSh;ctx.fillRect(bx+7*s,by+1*s,2*s,5*s);
    ctx.fillStyle=PAL.hair;ctx.fillRect(bx+1*s,by,8*s,2*s);ctx.fillRect(bx+1*s,by+1*s,1*s,2*s);ctx.fillRect(bx+8*s,by+1*s,1*s,2*s);
    ctx.fillStyle=PAL.hairLight;ctx.fillRect(bx+2*s,by,3*s,1*s);
    if(c.dir!==3){
      ctx.fillStyle='#2b2b2b';ctx.fillRect(bx+3*s,by+3*s,s,s+1);ctx.fillRect(bx+6*s,by+3*s,s,s+1);
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillRect(bx+3*s,by+3*s,1,1);ctx.fillRect(bx+6*s,by+3*s,1,1);
      ctx.fillStyle='#7a4a3a';ctx.fillRect(bx+4*s,by+5*s,2*s,1);
    }
  }
  ctx.fillStyle='rgba(6,10,20,0.78)';ctx.font='9px "Press Start 2P"';
  const tw=ctx.measureText(c.name).width;
  ctx.fillRect(c.x-tw/2-3,by-12,tw+6,12);
  ctx.fillStyle=c.color;ctx.fillText(c.name,c.x-tw/2,by-3);
  if(c.state==='idle'&&!c.bubble){ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('💤',c.x,by-15);ctx.textAlign='left';}
  if(c.bubble){
    const isEmoji=[...c.bubble].length<=2;
    ctx.font=isEmoji?'13px sans-serif':'10px "DotGothic16",sans-serif';
    let txt=c.bubble;if(!isEmoji&&txt.length>28)txt=txt.slice(0,27)+'…';
    const tw2=ctx.measureText(txt).width;const bw=Math.max(22,tw2+12),bh=17;const cx=c.x,cy=by-30;
    ctx.fillStyle='rgba(255,253,245,0.97)';ctx.strokeStyle='#1a1208';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(cx-bw/2,cy-bh/2,bw,bh,5);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-3,cy+bh/2-1);ctx.lineTo(cx+3,cy+bh/2-1);ctx.lineTo(cx,cy+bh/2+5);ctx.closePath();ctx.fillStyle='rgba(255,253,245,0.97)';ctx.fill();
    ctx.fillStyle='#1a1208';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,cx,cy);ctx.textAlign='left';ctx.textBaseline='alphabetic';
  }
}
function drawParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;ctx.globalAlpha=p.life/60;ctx.font='14px sans-serif';ctx.fillStyle=p.color;ctx.fillText(p.text||'⭐',p.x,p.y);ctx.globalAlpha=1;});
}
function getTimeColor(){const h=new Date().getHours();if(h>=6&&h<10)return 'rgba(255,200,100,0.04)';if(h>=10&&h<17)return 'rgba(255,255,255,0)';if(h>=17&&h<20)return 'rgba(255,150,50,0.06)';return 'rgba(20,24,60,0.18)';}

let tick=0;
function gameLoop(){
  tick++;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0e1a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(OX,OY);ctx.scale(scale,scale);
  ROOMS.forEach(drawRoom);
  characters.forEach(c=>drawDesk(c.desk.x,c.desk.y));
  characters.forEach(c=>c.update());
  [...characters].sort((a,b)=>a.y-b.y).forEach(drawCharacter);
  drawParticles();
  ctx.fillStyle=getTimeColor();ctx.fillRect(-OX/scale,-OY/scale,W/scale,H/scale);
  ctx.restore();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const API=window.location.origin;
const ROOM_LABELS={lead:'บริหาร',news:'กองข่าว',review:'ตรวจสอบ',creative:'ครีเอทีฟ'};
// some server feedback is stored as a structured object — never hand React an object to render
const asText=(v)=>{
  if(v==null)return '';
  if(typeof v==='string')return v;
  if(typeof v==='number'||typeof v==='boolean')return String(v);
  if(Array.isArray(v))return v.map(asText).filter(Boolean).join(' · ');
  if(typeof v==='object')return Object.values(v).map(asText).filter(Boolean).join(' — ');
  return String(v);
};

function App(){
  const TEAM=window.TEAM;
  const [panel,setPanel]=useState(null);
  const [logs,setLogs]=useState([]);
  const [running,setRunning]=useState(false);
  const [postMode,setPostMode]=useState('auto');
  const [tokens,setTokens]=useState([]);
  const [agents,setAgents]=useState([]);
  const [stats,setStats]=useState({});
  const [chatLogs,setChatLogs]=useState([{from:'pm',text:'สวัสดีครับ PM พร้อมทำงานแล้ว! 🎮'}]);
  const [chatInput,setChatInput]=useState('');
  const [chatLoading,setChatLoading]=useState(false);
  const [trainAgent,setTrainAgent]=useState('writer.json');
  const [trainText,setTrainText]=useState('');
  const [trainResult,setTrainResult]=useState('');
  const [time,setTime]=useState('');
  const [today,setToday]=useState('');
  const [notifs,setNotifs]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [agentStates,setAgentStates]=useState([]);
  const [pipelineStep,setPipelineStep]=useState(-1);
  const [pending,setPending]=useState([]);
  const [analytics,setAnalytics]=useState(null);
  const [analyticsLoading,setAnalyticsLoading]=useState(false);
  const [profileId,setProfileId]=useState(null);
  const [profileMem,setProfileMem]=useState([]);
  const [profileLoading,setProfileLoading]=useState(false);
  const [teamChat,setTeamChat]=useState([]);
  const chatEndRef=useRef(null);
  const logEndRef=useRef(null);

  const addLog=(msg,err)=>setLogs(p=>[...p.slice(-50),{t:new Date().toLocaleTimeString('th-TH'),msg,err}]);
  const addNotif=(msg)=>{const id=Date.now();setNotifs(p=>[...p,{id,msg}]);setTimeout(()=>setNotifs(p=>p.filter(n=>n.id!==id)),4000);};

  useEffect(()=>{
    const upd=()=>{const d=new Date();setTime(d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));setToday(d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}));};
    upd();const i=setInterval(upd,1000);return()=>clearInterval(i);
  },[]);

  const lastFocusRef=useRef(null);
  useEffect(()=>{
    if(!panel){if(lastFocusRef.current){lastFocusRef.current.focus?.();lastFocusRef.current=null;}return;}
    lastFocusRef.current=document.activeElement;
    const focusables=()=>{const p=document.querySelector('.panel');if(!p)return [];return [...p.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.offsetParent!==null);};
    requestAnimationFrame(()=>{const els=focusables();(els[0]||document.querySelector('.panel'))?.focus?.();});
    const onKey=e=>{
      if(e.key==='Escape'){setPanel(null);return;}
      if(e.key==='Tab'){const els=focusables();if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    };
    window.addEventListener('keydown',onKey);return()=>window.removeEventListener('keydown',onKey);
  },[panel]);

  const fetchAll=useCallback(async()=>{
    try{
      const [tRes,aRes,mRes,pRes,sRes]=await Promise.all([
        fetch(API+'/api/tokens').then(r=>r.json()).catch(()=>[]),
        fetch(API+'/api/agents').then(r=>r.json()).catch(()=>[]),
        fetch(API+'/api/postmode').then(r=>r.json()).catch(()=>({mode:'auto'})),
        fetch(API+'/api/pending').then(r=>r.json()).catch(()=>[]),
        fetch(API+'/api/stats').then(r=>r.json()).catch(()=>({})),
      ]);
      setTokens(tRes);setAgents(aRes);setPostMode(mRes.mode);
      setPending(Array.isArray(pRes)?pRes:[]);setStats(sRes&&typeof sRes==='object'?sRes:{});
    }catch{}finally{setLoaded(true);}
  },[]);
  const fetchPending=useCallback(async()=>{try{const r=await fetch(API+'/api/pending');const d=await r.json();setPending(Array.isArray(d)?d:[]);}catch{}},[]);
  const approveItem=async(id,item)=>{try{await fetch(API+`/api/pending/${id}/approve?item=${item}`,{method:'POST'});addNotif('อนุมัติแล้ว — กำลังโพสต์ ✅');addLog(`✅ อนุมัติโพสต์ ${id}#${item}`);}catch(e){addNotif('อนุมัติไม่ได้');}fetchPending();};
  const rejectItem=async(id,item)=>{try{await fetch(API+`/api/pending/${id}/reject?item=${item}`,{method:'POST'});addNotif('ไม่อนุมัติ ✕');addLog(`✕ ปฏิเสธโพสต์ ${id}#${item}`);}catch(e){addNotif('ทำไม่ได้');}fetchPending();};
  const clearPending=async()=>{try{await fetch(API+'/api/pending/clear',{method:'POST'});addNotif('ล้าง pending แล้ว');}catch{}fetchPending();};
  const loadAnalytics=useCallback(async()=>{setAnalyticsLoading(true);try{const r=await fetch(API+'/api/analytics');const d=await r.json();setAnalytics(d);}catch(e){setAnalytics({error:e.message});}setAnalyticsLoading(false);},[]);
  const sendToOpenClaw=async()=>{const msg=chatInput.trim();if(!msg)return;setChatInput('');setChatLogs(p=>[...p,{from:'user',text:msg},{from:'sys',text:'📨 ส่งให้ PM (OpenClaw) ใน Discord แล้ว — รอคำตอบในช่อง Discord'}]);try{await fetch(API+'/api/chat/discord',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});}catch(e){setChatLogs(p=>[...p,{from:'sys',text:'ส่งไม่ได้: '+e.message}]);}};
  // open an employee profile: ping the character + load their REAL learned lessons
  const openProfile=useCallback(async(id)=>{
    window.pingCharacter&&window.pingCharacter(id);
    setProfileId(id);setPanel('profile');setProfileLoading(true);setProfileMem([]);
    const t=TEAM.find(x=>x.id===id);if(!t){setProfileLoading(false);return;}
    try{const r=await fetch(API+'/api/memory?agent='+encodeURIComponent(t.file));const d=await r.json();setProfileMem(Array.isArray(d)?d:[]);}catch{setProfileMem([]);}
    setProfileLoading(false);
  },[TEAM]);
  const loadTeamChat=useCallback(async()=>{try{const r=await fetch(API+'/api/team_chat');const d=await r.json();setTeamChat(Array.isArray(d)?d:[]);}catch{}},[]);

  useEffect(()=>{fetchAll();const i=setInterval(fetchAll,20000);return()=>clearInterval(i);},[fetchAll]);

  const runPipeline=async()=>{
    if(running)return;
    setRunning(true);window.gameState.pipelineRunning=true;window.startPipelineAnim();
    addLog('🚀 Pipeline เริ่มทำงาน...');addNotif('Pipeline เริ่มแล้ว!');setPanel(null);
    setPipelineStep(0);
    let stepTimer=setInterval(()=>setPipelineStep(s=>(s>=0&&s<4)?s+1:s),1600);
    let shownChat=0;
    const chatPoll=setInterval(async()=>{try{const r=await fetch(API+'/api/team_chat');const arr=await r.json();if(Array.isArray(arr)&&arr.length>shownChat){for(let i=shownChat;i<arr.length;i++){const m=arr[i];window.sayLine&&window.sayLine(m.id,m.text,240);}shownChat=arr.length;}}catch{}},1500);
    const finish=(ok)=>{clearInterval(stepTimer);clearInterval(chatPoll);setRunning(false);window.gameState.pipelineRunning=false;window.endPipelineAnim(ok);if(ok){setPipelineStep(5);setTimeout(()=>setPipelineStep(-1),3000);}else setPipelineStep(-1);fetchPending();};
    try{
      await fetch(API+'/api/run',{method:'POST'});
      const poll=setInterval(async()=>{try{const r=await fetch(API+'/api/run/status');const d=await r.json();if(d.status==='done'||d.status==='idle'){clearInterval(poll);finish(true);addLog('✅ Pipeline เสร็จแล้ว!');addNotif('Pipeline เสร็จสมบูรณ์!');if(d.log){d.log.split('\n').filter(l=>l.trim()).slice(-10).forEach(l=>addLog(l));}}}catch{clearInterval(poll);finish(false);}},3000);
    }catch(e){finish(false);addLog('❌ Pipeline error: '+e.message,true);}
  };
  const toggleMode=async()=>{try{const r=await fetch(API+'/api/postmode',{method:'POST'});const d=await r.json();setPostMode(d.mode);addNotif('โหมด: '+(d.mode==='auto'?'โพสต์เลย ⚡':'ถามก่อนโพสต์ 🔍'));}catch{}};
  const sendChat=async()=>{
    if(!chatInput.trim()||chatLoading)return;const msg=chatInput.trim();setChatInput('');
    setChatLogs(p=>[...p,{from:'user',text:msg}]);setChatLoading(true);
    try{const r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const d=await r.json();setChatLogs(p=>[...p,{from:'pm',text:asText(d.reply)||asText(d.error)||'...'}]);if(d.trained)addNotif('PM สั่งเทรนพนักงานแล้ว!');}catch(e){setChatLogs(p=>[...p,{from:'sys',text:'Error: '+e.message}]);}
    setChatLoading(false);
  };
  const doTrain=async()=>{
    if(!trainText.trim())return;setTrainResult('กำลังเทรน...');
    try{const r=await fetch(API+'/api/train',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent:trainAgent,feedback:trainText})});const d=await r.json();
      setTrainResult(`✅ ${d.name} จำแล้ว (${d.memoryCount} ความจำ)`);setTrainText('');addNotif('เทรนสำเร็จ!');
      const cid=trainAgent.replace('.json','');const ch=window.characters?.find(c=>c.id===cid);if(ch){ch.showBubble('📚',100);window.addParticle?.(ch.x,ch.y-30,'#ffd54f','+EXP');}
    }catch(e){setTrainResult('❌ '+e.message);}
  };

  useEffect(()=>{chatEndRef.current?.scrollIntoView({behavior:'smooth'});},[chatLogs]);
  useEffect(()=>{logEndRef.current?.scrollIntoView({behavior:'smooth'});},[logs]);
  useEffect(()=>{const i=setInterval(()=>{if(window.getAgentStates)setAgentStates(window.getAgentStates());},250);return()=>clearInterval(i);},[]);
  useEffect(()=>{if(panel==='analytics'&&analytics===null)loadAnalytics();},[panel,analytics,loadAnalytics]);
  useEffect(()=>{if(panel==='pending')fetchPending();},[panel,fetchPending]);
  useEffect(()=>{if(panel==='activity'){loadTeamChat();const i=setInterval(loadTeamChat,8000);return()=>clearInterval(i);}},[panel,loadTeamChat]);

  useEffect(()=>{
    const load=async()=>{
      if(window.gameState&&window.gameState.pipelineRunning)return;
      try{const r=await fetch(API+'/api/team_chat');const arr=await r.json();
        if(Array.isArray(arr)&&arr.length){const recent=arr.slice(-3);recent.forEach((m,i)=>setTimeout(()=>window.sayLine&&window.sayLine(m.id,m.text,200),i*1200));}
      }catch{}
    };
    const i=setInterval(load,30000);return()=>clearInterval(i);
  },[]);

  const stateOf=(id)=>agentStates.find(a=>a.id===id);
  const onlineCount=agentStates.length||TEAM.length;        // present in office
  const workingNow=agentStates.filter(a=>a.state!=='idle').length; // actively at work
  const pendingCount=pending.reduce((n,p)=>n+(p.items?.length||0),0);
  const STAGES=[{id:'reporter',label:'นักข่าว'},{id:'writer',label:'นักเขียน'},{id:'guardian',label:'ตรวจสอบ'},{id:'graphic',label:'กราฟิก'},{id:'publisher',label:'โพสต์'}];
  const roomCount=(rid)=>TEAM.filter(t=>t.roomId===rid).length;
  const avgAccuracy=(()=>{const arr=TEAM.map(t=>stats[t.file]).filter(s=>s&&s.runs>0);if(!arr.length)return null;return Math.round(arr.reduce((a,s)=>a+(s.accuracy||0),0)/arr.length);})();

  const NAV=[
    {key:'office',ic:'🏠',label:'ภาพรวมออฟฟิศ',onClick:()=>setPanel(null)},
    {key:'run',ic:running?'⏳':'▶️',label:running?'กำลังรัน...':'รันงาน',onClick:runPipeline,disabled:running,cls:'run'},
    {key:'staff',ic:'👥',label:'รายชื่อทีม',onClick:()=>setPanel('staff')},
    {key:'chat',ic:'💬',label:'คุยกับ PM',onClick:()=>setPanel('chat')},
    {key:'train',ic:'🎓',label:'เทรนพนักงาน',onClick:()=>setPanel('train')},
    {key:'activity',ic:'💬',label:'ทีมคุยกัน',onClick:()=>setPanel('activity')},
    {key:'pending',ic:'✅',label:'รออนุมัติ',onClick:()=>setPanel('pending'),badge:pendingCount},
    {key:'analytics',ic:'📊',label:'สถิติเพจ',onClick:()=>setPanel('analytics')},
    {key:'log',ic:'📋',label:'บันทึกงาน',onClick:()=>setPanel('log')},
  ];

  const dirRows=TEAM.map((t,i)=>{
    const st=stateOf(t.id);const stat=stats[t.file];
    const dot=!st?'idle':(st.state==='working'?'on':st.state==='walking'?'busy':'idle');
    const col=`var(--c-${t.id})`;
    return <button key={t.id} className="dir-row" onClick={()=>openProfile(t.id)} title={stat?`Lv.${stat.level} ${stat.title} · ${stat.runs} งาน · เรียนรู้ ${stat.lessons} บทเรียน — คลิกดูโปรไฟล์`:`ดูโปรไฟล์ ${t.name}`}>
      <span className="dir-num">{String(i+1).padStart(2,'0')}</span>
      <span className="dir-av" style={{borderColor:col,color:col}}>{t.icon}</span>
      <span className="dir-meta">
        <span className="dir-name" style={{color:col}}>{t.name}{stat&&<span className="dir-lv">Lv.{stat.level}</span>}</span>
        <span className="dir-role">{t.role} · {ROOM_LABELS[t.roomId]}</span>
      </span>
      <span className={`dir-dot ${dot}`}/>
    </button>;
  });

  return <>
    {/* ===== TOP BAR ===== */}
    <div className="top-bar">
      <div className="brand">
        <div className="logo">🎮</div>
        <div className="bt"><div className="n">PANG NEWS CO.</div><div className="s">โรงงานข่าวเกมอัตโนมัติ</div></div>
      </div>
      <div className="tb-spacer"/>
      <div className="tb-pill"><span className="led"/>ทีมงาน {onlineCount}/{TEAM.length} ออนไลน์{workingNow>0?` · ${workingNow} กำลังทำงาน`:''}</div>
      <div className="tb-pill"><span className="status-badge status-auto" style={{padding:'1px 6px'}}>GitHub Actions 24/7</span></div>
      <div className="tb-clock"><div className="d">{today}</div><div className="t">{time}</div></div>
      <button className="tb-bell" onClick={()=>setPanel('pending')} aria-label="การแจ้งเตือน">🔔{pendingCount>0&&<span className="badge">{pendingCount}</span>}</button>
    </div>

    {/* ===== COMPACT TOOLBAR (mobile) ===== */}
    <div className="toolbar-c">
      {NAV.filter(n=>n.key!=='office').map(n=><button key={n.key} className="btn-game" onClick={n.onClick} disabled={n.disabled}>{n.ic} {n.label}{n.badge>0?` (${n.badge})`:''}</button>)}
      <button className="btn-game" style={{borderColor:'var(--gold)',color:'var(--gold)'}} onClick={toggleMode}>{postMode==='auto'?'⚡ AUTO':'🔍 APPROVE'}</button>
    </div>

    {/* ===== LEFT SIDEBAR ===== */}
    <aside className="sidebar-l" aria-label="เมนูออฟฟิศ">
      <div className="nav-group-label">เมนูหลัก</div>
      {NAV.map(n=>{
        const active=(n.key==='office'&&!panel)||panel===n.key;
        return <button key={n.key} className={`nav-item ${active?'active':''} ${n.cls||''}`} onClick={n.onClick} disabled={n.disabled}>
          <span className="ic">{n.ic}</span><span>{n.label}</span>{n.badge>0&&<span className="nb">{n.badge}</span>}
        </button>;
      })}
      <div className="spacer-grow"/>
      <div className="office-status">
        <div className="h">สถานะออฟฟิศ</div>
        <div className="os-row"><span>การทำงาน</span><span className="ok">{running?'กำลังรัน':'เปิด & พร้อม'}</span></div>
        <div className="os-row"><span>ทีมออนไลน์</span><b>{onlineCount}/{TEAM.length}</b></div>
        <div className="os-row"><span>รออนุมัติ</span><b>{pendingCount}</b></div>
        <div className="os-row"><span>ความแม่นเฉลี่ย</span><b>{avgAccuracy!==null?avgAccuracy+'%':'—'}</b></div>
        <button className="mode-toggle" onClick={toggleMode}>{postMode==='auto'?'⚡ โหมด: โพสต์เลย':'🔍 โหมด: ขออนุมัติ'}</button>
      </div>
    </aside>

    {/* ===== RIGHT SIDEBAR (TEAM DIRECTORY) ===== */}
    <aside className="sidebar-r" aria-label="รายชื่อทีมงาน">
      <div className="dir-head">รายชื่อทีม <span className="c">{TEAM.length} คน</span></div>
      <div className="dir-list">{dirRows}</div>
      <div className="dir-foot">
        <div className="all">✓ ทีมงานทั้งหมดออนไลน์</div>
        <div className="sys-row"><span className="ck">✓</span> AI พนักงานพร้อมทำงาน</div>
        <div className="sys-row"><span className="ck">✓</span> Pipeline อัตโนมัติ</div>
        <div className="sys-row"><span className="ck">✓</span> GitHub Actions 24/7</div>
        <div className="sys-row"><span className="ck">✓</span> โหมดโพสต์: {postMode==='auto'?'AUTO':'APPROVE'}</div>
      </div>
    </aside>

    {/* ===== PIPELINE STRIP (running) ===== */}
    {running&&<div className="pipeline" role="group" aria-label="ความคืบหน้า pipeline">
      <span className="plabel">PIPELINE</span>
      {STAGES.map((st,i)=>{const done=pipelineStep===5||(pipelineStep>=0&&pipelineStep>i);const active=pipelineStep===i;
        return <div key={st.id} className={`pstep ${done?'done':''} ${active?'active':''}`}><span className="chip"><span className="n">{done?'✓':i+1}</span>{st.label}</span>{i<STAGES.length-1&&<span className="arrow">▸</span>}</div>;})}
    </div>}

    {/* ===== BOTTOM BAR (stat cards) ===== */}
    <div className="bottom-bar">
      <button className="stat-tile" style={{'--accent':'var(--cyan)'}} onClick={()=>setPanel('staff')} title="ดูรายชื่อทีม"><span className="ic2">👥</span><div className="big">{TEAM.length}</div><div className="lb">ทีมงานทั้งหมด</div></button>
      <button className="stat-tile" style={{'--accent':'var(--c-pm)'}} onClick={()=>openProfile('pm')} title="โปรไฟล์ PM"><span className="ic2">👔</span><div className="big">{roomCount('lead')}</div><div className="lb">บริหาร</div></button>
      <button className="stat-tile" style={{'--accent':'var(--c-reporter)'}} onClick={()=>openProfile('reporter')} title="โปรไฟล์กองข่าว"><span className="ic2">📰</span><div className="big">{roomCount('news')}</div><div className="lb">กองข่าว</div></button>
      <button className="stat-tile" style={{'--accent':'var(--c-guardian)'}} onClick={()=>openProfile('guardian')} title="โปรไฟล์ตรวจสอบ"><span className="ic2">🔍</span><div className="big">{roomCount('review')}</div><div className="lb">ตรวจสอบ</div></button>
      <button className="stat-tile" style={{'--accent':'var(--c-graphic)'}} onClick={()=>openProfile('graphic')} title="โปรไฟล์ครีเอทีฟ"><span className="ic2">🎨</span><div className="big">{roomCount('creative')}</div><div className="lb">ครีเอทีฟ</div></button>
      <button className="automation" onClick={runPipeline} disabled={running} title={running?'กำลังรัน':'กดเพื่อรันงาน'}>
        <div className="bot">🤖</div>
        <div className="at"><div className="t">{running?'กำลังผลิตคอนเทนต์...':'พร้อมทำงาน 24/7'}</div><div className="s">AI × ข่าวเกม × อัตโนมัติ — โพสต์ FB + IG</div></div>
      </button>
    </div>

    {/* ===== NOTIFICATIONS ===== */}
    <div className="notif">{notifs.map(n=><div key={n.id} className="notif-card">{n.msg}</div>)}</div>

    {/* ===== PANELS ===== */}
    {panel==='staff'&&<div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
      <div className="panel" role="dialog" aria-modal="true" aria-label="รายชื่อพนักงาน" tabIndex={-1}>
        <div className="panel-title">👥 รายชื่อพนักงาน<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
        <div className="panel-body">
          {!loaded&&[0,1,2,3].map(i=><div key={i} className="skeleton skel-card"/>)}
          {loaded&&TEAM.map((t,i)=>{const a=agents.find(x=>x.file===t.file)||{};const stat=stats[t.file];const col=`var(--c-${t.id})`;
            return <div key={t.id} className="emp-card" onClick={()=>openProfile(t.id)} style={{cursor:'pointer'}} title={`ดูโปรไฟล์ ${t.name}`}>
              <div className="emp-avatar" style={{borderColor:col,color:col}}>{t.icon}</div>
              <div className="emp-info">
                <div className="emp-name" style={{color:col}}>{t.name} <span style={{color:'var(--muted)',fontSize:'8px'}}>· {ROOM_LABELS[t.roomId]}</span></div>
                <div className="emp-role">{t.role}{a.role?` — ${a.role}`:''}</div>
                <div style={{display:'flex',gap:'8px',marginTop:'4px',fontSize:'10px',flexWrap:'wrap'}}>
                  <span style={{color:'var(--muted)'}}>{a.model?`AI: ${a.provider}/${a.model}`:'⚙️ อัตโนมัติ'}</span>
                  <span style={{color:'var(--gold)'}}>💾 {a.memoryCount||0} mem</span>
                </div>
                {stat&&<div style={{marginTop:'5px'}}>
                  <div style={{display:'flex',gap:'8px',fontSize:'10px',alignItems:'center',flexWrap:'wrap'}}>
                    <span style={{color:'var(--gold)',fontWeight:'bold'}}>⚡Lv.{stat.level} {stat.title}</span>
                    {stat.runs>0&&<span style={{color:'var(--muted)'}}>🎯 แม่น {stat.accuracy}%</span>}
                    <span style={{color:'var(--muted)'}}>📚 {stat.lessons} บทเรียน</span>
                  </div>
                  <div style={{height:'4px',background:'rgba(255,255,255,0.12)',borderRadius:'2px',marginTop:'3px',overflow:'hidden'}}><div style={{height:'4px',width:(stat.xpPct||0)+'%',background:col,borderRadius:'2px'}}/></div>
                </div>}
              </div>
              <div className="emp-stars">{'⭐'.repeat(Math.min(5,Math.max(1,stat?stat.level:Math.ceil((a.memoryCount||1)/3))))}</div>
            </div>;})}
        </div>
      </div>
    </div>}

    {panel==='chat'&&<div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
      <div className="panel" role="dialog" aria-modal="true" aria-label="แชทกับ PM" tabIndex={-1}>
        <div className="panel-title">💬 คุยกับ PM<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
        <div className="panel-body">
          <div className="chat-box">
            {chatLogs.map((m,i)=><div key={i} className={`chat-msg ${m.from}`}><strong>{m.from==='pm'?'🤖 PM':m.from==='user'?'👤 คุณ':'⚙️ ระบบ'}:</strong> {m.text}</div>)}
            {chatLoading&&<div className="chat-msg pm" style={{opacity:.5}}>🤖 PM กำลังคิด...</div>}
            <div ref={chatEndRef}/>
          </div>
          <input className="chat-input" placeholder="พิมพ์ข้อความถึง PM..." value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')sendChat()}}/>
          <div style={{display:'flex',gap:'8px',marginTop:'8px'}}>
            <button className="btn-game btn-chat" style={{flex:1}} onClick={sendChat} disabled={chatLoading}>💬 ถาม PM</button>
            <button className="btn-game btn-analytics" style={{flex:1}} onClick={sendToOpenClaw} title="ส่งให้ OpenClaw ตอบใน Discord">📨 ส่งให้ OpenClaw</button>
          </div>
        </div>
      </div>
    </div>}

    {panel==='train'&&<div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
      <div className="panel" role="dialog" aria-modal="true" aria-label="เทรนพนักงาน" tabIndex={-1}>
        <div className="panel-title">🎓 เทรนพนักงาน<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
        <div className="panel-body">
          <div style={{marginBottom:'8px',fontSize:'12px',color:'var(--muted)'}}>เลือกพนักงานที่จะสอน แล้วพิมพ์ feedback</div>
          <select className="train-select" value={trainAgent} onChange={e=>setTrainAgent(e.target.value)}>
            {TEAM.map(t=><option key={t.file} value={t.file}>{t.icon} {t.name}</option>)}
          </select>
          <textarea className="train-textarea" placeholder="เช่น: caption สั้นลง ไม่เกิน 3 บรรทัด" value={trainText} onChange={e=>setTrainText(e.target.value)}/>
          <button className="btn-game btn-train" style={{width:'100%',padding:'11px'}} onClick={doTrain}>🎓 เทรน!</button>
          {trainResult&&<div style={{marginTop:'8px',fontSize:'12px',color:trainResult.startsWith('✅')?'var(--good)':'var(--bad)'}}>{trainResult}</div>}
        </div>
      </div>
    </div>}

    {panel==='log'&&<div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
      <div className="panel" role="dialog" aria-modal="true" aria-label="บันทึกกิจกรรม" tabIndex={-1}>
        <div className="panel-title">📋 บันทึกงาน<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
        <div className="panel-body">
          <div className="log-box">
            {logs.length===0&&<div className="empty-state"><div className="icon">📭</div><div className="head">ยังไม่มี activity</div><div className="sub">กด <strong>รันงาน</strong> เพื่อเริ่มผลิต content แล้ว log จะขึ้นที่นี่</div></div>}
            {logs.map((l,i)=><div key={i} className={`log-line ${l.err?'err':''}`}>[{l.t}] {l.msg}</div>)}
            <div ref={logEndRef}/>
          </div>
        </div>
      </div>
    </div>}

    {panel==='pending'&&<div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
      <div className="panel" role="dialog" aria-modal="true" aria-label="โพสต์รออนุมัติ" tabIndex={-1}>
        <div className="panel-title">✅ รออนุมัติ ({pendingCount})<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
        <div className="panel-body">
          {pendingCount===0&&<div className="empty-state"><div className="icon">🗳️</div><div className="head">ไม่มีโพสต์รออนุมัติ</div><div className="sub">โพสต์จะมาที่นี่เมื่ออยู่โหมด <strong>Approve</strong> แล้ว pipeline ทำงาน</div></div>}
          {pending.map(grp=>(grp.items||[]).map((it,idx)=><div key={grp.id+'_'+idx} className="pending-card">
            {it.image&&<img src={it.image} alt={it.headline} loading="lazy"/>}
            <div className="pending-head">{it.headline}</div>
            <div className="pending-cap">{it.caption}</div>
            {it.sourceName&&<div className="pending-src">📰 {it.sourceName}</div>}
            <div className="pending-actions"><button className="btn-game btn-ok" onClick={()=>approveItem(grp.id,idx)}>✅ อนุมัติ + โพสต์</button><button className="btn-game btn-no" onClick={()=>rejectItem(grp.id,idx)}>✕ ไม่อนุมัติ</button></div>
          </div>))}
          {pendingCount>0&&<button className="btn-game btn-no" style={{width:'100%',marginTop:'4px'}} onClick={clearPending}>🗑 ล้างทั้งหมด</button>}
        </div>
      </div>
    </div>}

    {panel==='analytics'&&<div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
      <div className="panel" role="dialog" aria-modal="true" aria-label="สถิติ Facebook" tabIndex={-1}>
        <div className="panel-title">📊 สถิติเพจ<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
        <div className="panel-body">
          {analyticsLoading&&[0,1,2].map(i=><div key={i} className="skeleton skel-card"/>)}
          {!analyticsLoading&&analytics&&analytics.error&&<div className="empty-state"><div className="icon">📉</div><div className="head">ดึงสถิติไม่ได้</div><div className="sub">{analytics.error}</div></div>}
          {!analyticsLoading&&Array.isArray(analytics)&&analytics.length===0&&<div className="empty-state"><div className="icon">📊</div><div className="head">ยังไม่มีโพสต์</div><div className="sub">โพสต์ลง Facebook แล้วสถิติจะขึ้นที่นี่</div></div>}
          {!analyticsLoading&&Array.isArray(analytics)&&analytics.map(p=><div key={p.id} className="stat-card">
            {p.image&&<img src={p.image} alt="" loading="lazy"/>}
            <div className="sc-body"><div className="stat-msg">{p.message||'(ไม่มีข้อความ)'}</div>
              <div className="stat-row"><span><b>{p.likes}</b>👍</span><span><b>{p.comments}</b>💬</span><span><b>{p.shares}</b>🔁</span><span><b>{p.reach}</b>👁</span></div>
              {p.permalink_url&&<a className="sc-link" href={p.permalink_url} target="_blank" rel="noopener noreferrer">ดูโพสต์ ↗</a>}
            </div>
          </div>)}
        </div>
      </div>
    </div>}

    {panel==='profile'&&(()=>{const t=TEAM.find(x=>x.id===profileId);if(!t)return null;const stat=stats[t.file];const col=`var(--c-${t.id})`;
      return <div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
        <div className="panel" role="dialog" aria-modal="true" aria-label={`โปรไฟล์ ${t.name}`} tabIndex={-1}>
          <div className="panel-title">{t.icon} โปรไฟล์พนักงาน<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
          <div className="panel-body">
            <div className="prof-top">
              <div className="prof-av" style={{borderColor:col,color:col}}>{t.icon}</div>
              <div className="prof-id">
                <div className="prof-name" style={{color:col}}>{t.name}</div>
                <div className="prof-sub">{t.role} · {ROOM_LABELS[t.roomId]}</div>
                {stat&&<div className="prof-lv">⚡ Lv.{stat.level} {stat.title}</div>}
              </div>
            </div>
            {stat?<>
              <div className="prof-xpwrap">
                <div className="prof-xplabel"><span>EXP</span><span>{stat.xp} XP · ไปเลเวลถัดไป {stat.xpPct}%</span></div>
                <div className="prof-xpbar"><div style={{width:(stat.xpPct||0)+'%',background:col}}/></div>
              </div>
              <div className="prof-grid">
                <div className="prof-stat"><div className="v">{stat.runs}</div><div className="k">งานทั้งหมด</div></div>
                <div className="prof-stat"><div className="v" style={{color:'var(--good)'}}>{stat.accuracy}%</div><div className="k">ความแม่น</div></div>
                <div className="prof-stat"><div className="v" style={{color:'var(--warn)'}}>{stat.retries}</div><div className="k">แก้งาน</div></div>
                <div className="prof-stat"><div className="v" style={{color:'var(--gold)'}}>{stat.lessons}</div><div className="k">บทเรียน</div></div>
              </div>
            </>:<div className="empty-state" style={{padding:'10px 0 14px'}}><div className="sub">พนักงานคนนี้เป็นระบบอัตโนมัติ (ไม่ใช้ LLM) — ยังไม่มีสถิติการเรียนรู้</div></div>}
            <div className="sect-label">📚 บทเรียนที่เรียนรู้ <span className="c">{profileMem.length} รายการ</span></div>
            {profileLoading&&[0,1].map(i=><div key={i} className="skeleton skel-card"/>)}
            {!profileLoading&&profileMem.length===0&&<div className="empty-state"><div className="icon">🌱</div><div className="head">ยังไม่มีบทเรียน</div><div className="sub">เมื่อ PM/ตรวจสอบ ให้ feedback ระหว่างทำงานจริง บทเรียนจะถูกบันทึกที่นี่</div></div>}
            {!profileLoading&&profileMem.map((m,i)=><div key={i} className="lesson">
              <div className="lesson-meta"><span className="from">🎓 {asText(m.from)}</span><span>{(()=>{try{return new Date(m.date).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})}catch{return ''}})()}</span></div>
              <div className="lesson-txt">{asText(m.feedback)}</div>
            </div>)}
            <div className="prof-actions">
              <button className="btn-game btn-train" onClick={()=>{setTrainAgent(t.file);setPanel('train');}}>🎓 เทรนคนนี้</button>
              <button className="btn-game btn-chat" onClick={()=>window.pingCharacter&&window.pingCharacter(t.id)}>👋 ทักทาย</button>
            </div>
          </div>
        </div>
      </div>;})()}

    {panel==='activity'&&<div className="panel-overlay" onClick={e=>{if(e.target===e.currentTarget)setPanel(null)}}>
      <div className="panel" role="dialog" aria-modal="true" aria-label="ทีมคุยกัน" tabIndex={-1}>
        <div className="panel-title">💬 ทีมคุยกัน<button className="btn-game btn-close" onClick={()=>setPanel(null)} aria-label="ปิด">✕</button></div>
        <div className="panel-body">
          <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'10px'}}>บทประสานงานจริงจากงานล่าสุด — owner → PM → พนักงาน (อัปเดตทุก 8 วินาที)</div>
          <div className="feed">
            {teamChat.length===0&&<div className="empty-state"><div className="icon">💭</div><div className="head">ยังไม่มีบทสนทนา</div><div className="sub">กด <strong>รันงาน</strong> แล้วทีมจะเริ่มประสานงานกันจริง</div></div>}
            {teamChat.map((m,i)=>{const col=(window.PAL&&window.PAL[m.id])||'#9fb0cc';const tm=TEAM.find(x=>x.id===m.id);
              return <div key={i} className="feed-line">
                <div className="feed-av" style={{borderColor:col}}>{tm?tm.icon:'💬'}</div>
                <div className="feed-body"><div className="feed-who" style={{color:col}}>{asText(m.name)}</div><div className="feed-txt">{asText(m.text)}</div></div>
                <div className="feed-t">{m.t}</div>
              </div>;})}
          </div>
        </div>
      </div>
    </div>}
  </>;
}

window.PAL={pm:'#ff5a52',reporter:'#3aa0ff',writer:'#46c46a',guardian:'#b06cff',graphic:'#ff9838',publisher:'#ffd23f'};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
