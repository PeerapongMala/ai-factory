name: Pang Game - Static Post Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes, 24/7
  workflow_dispatch: # Manual trigger button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Restore processed hashes from cache
        uses: actions/cache@v4
        with:
          path: logs/processed_hashes.json
          key: processed-hashes

      - name: PM - Run Pipeline
        run: bun run scripts/pm.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
          CREATOMATE_STATIC_TEMPLATE_ID: ${{ secrets.CREATOMATE_STATIC_TEMPLATE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}

      - name: Save processed hashes to cache
        uses: actions/cache/save@v4
        with:
          path: logs/processed_hashes.json
          key: processed-hashes
