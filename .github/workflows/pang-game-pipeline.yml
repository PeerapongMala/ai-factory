name: Pang Game - Static Post Pipeline

on:
  schedule:
    # หลบนาที :00/:30 ที่ทุก repo ทั้งโลกตั้งกัน — คิว GitHub แน่นจนโดนเลื่อน/ข้ามเป็นชั่วโมง
    - cron: '13,43 * * * *'  # Every 30 minutes (off-peak minutes), 24/7
  workflow_dispatch: # Manual trigger button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # rolling key — key ตายตัว save ซ้ำไม่ได้ (cache immutable) ทำให้ตัวกันโพสต์ซ้ำไม่เคยอัปเดต
      - name: Restore processed hashes from cache
        uses: actions/cache/restore@v4
        with:
          path: logs/processed_hashes.json
          key: processed-hashes-${{ github.run_id }}
          restore-keys: |
            processed-hashes-
            processed-hashes

      # พัฒนาการพนักงาน (level/xp) + บทเรียนสะสม — rolling key เพื่อให้ "อัปเดตได้จริง" ทุกรอบ
      - name: Restore learning state from cache
        uses: actions/cache/restore@v4
        with:
          path: |
            logs/agent_stats.json
            logs/agent_lessons.json
          key: agent-learning-${{ github.run_id }}
          restore-keys: |
            agent-learning-

      - name: PM - Run Pipeline
        run: bun run scripts/pm.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
          CREATOMATE_STATIC_TEMPLATE_ID: ${{ secrets.CREATOMATE_STATIC_TEMPLATE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save processed hashes to cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: logs/processed_hashes.json
          key: processed-hashes-${{ github.run_id }}

      # บันทึกพัฒนาการ + บทเรียนกลับเข้า cache (rolling key) → พนักงานเก่งขึ้นข้ามรอบ 24/7
      - name: Save learning state to cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            logs/agent_stats.json
            logs/agent_lessons.json
          key: agent-learning-${{ github.run_id }}
